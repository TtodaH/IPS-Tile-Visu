<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wetterstation Tile</title>
    <!-- IP-Symcon Icons / FontAwesome support -->
    <script src="/icons.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --needle-color: #00CDAB;
            --needle-bright: #14F1CD;
            --north-color: #F43F5E;
            --gust-color: #F59E0B;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --card-surface: transparent;
            --divider-color: rgba(255, 255, 255, 0.08);
            --badge-bg: rgba(255, 255, 255, 0.06);
            --badge-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
        }

        /* Hauptcontainer mit Flexbox: Nahtlose Anpassung an Standard-Kacheln */
        .wr-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            box-sizing: border-box;
            overflow: hidden;
            background: transparent;
        }

        /* Status-Leiste oben (Batterie & Regen) */
        .wr-top-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            font-weight: 600;
            min-height: 0;
            margin-bottom: 2px;
        }

        .wr-top-bar.empty {
            display: none !important;
        }

        .wr-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 1.5px 6px;
            border-radius: 10px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--text-secondary);
            transition: all 0.25s ease;
        }

        .wr-status-pill.rain {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #38BDF8;
        }

        .wr-status-pill.battery-warn {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
            color: #F59E0B;
        }

        .wr-status-pill.hidden {
            display: none !important;
        }

        /* Compass-Bereich (Windrose & Himmelsrichtung) */
        .wr-compass-section {
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Hero-Bereich (Windrose SVG): füllt flexibel den verfügbaren Platz aus */
        .wr-compass-hero {
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* SVG skaliert gleichmäßig nach Höhe und Breite */
        .wr-svg {
            height: 100%;
            width: auto;
            max-width: 100%;
            max-height: 100%;
            display: block;
            margin: auto;
            object-fit: contain;
        }

        /* Nadelrotation: butterweiche 60fps CSS Transitions */
        .needle-transition {
            transition: transform 0.8s cubic-bezier(0.34, 1.3, 0.64, 1);
            transform-origin: 60px 60px;
            transform-box: view-box;
        }

        .ghost-needle-transition {
            transition: transform 1.2s ease-out;
            transform-origin: 60px 60px;
            transform-box: view-box;
            opacity: 0.35;
        }

        /* Himmelsrichtung Badge unter dem Kompass */
        .wr-cardinal-badge {
            flex: 0 0 auto;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 0.3px;
            line-height: 1.1;
            margin: 2px 0;
            white-space: nowrap;
        }

        .wr-cardinal-sub {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-left: 2px;
        }

        /* Trennlinie */
        .wr-divider {
            flex: 0 0 auto;
            height: 1px;
            background: var(--divider-color);
            width: 100%;
            margin: 3px 0 4px 0;
        }

        /* Footer mit Temperaturen & Windwerten (bleibt IMMER sichtbar) */
        .wr-footer {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 2px;
            padding-bottom: 2px;
        }

        .wr-row1 {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
        }

        .wr-temp-val {
            font-size: 19px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .wr-temp-unit {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-left: 1px;
        }

        .wr-temp-tag {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 4px;
        }

        .wr-stall {
            font-size: 11.5px;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .wr-stall-val {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .wr-row2 {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            font-size: 11.5px;
            color: var(--text-secondary);
        }

        .wr-speed {
            display: inline-flex;
            align-items: baseline;
            gap: 2px;
            font-weight: 600;
        }

        .wr-speed-main {
            color: #38BDF8;
            font-weight: 700;
        }

        .wr-gust {
            font-weight: 600;
            color: var(--gust-color);
            margin-left: 4px;
        }

        .wr-bft {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        /* ---------------------------------------------------- */
        /* Vollbild-Modus & Vergrößerte Kachelansicht          */
        /* ---------------------------------------------------- */
        @media (min-height: 380px) and (min-width: 320px) {
            .wr-container {
                padding: 18px 24px;
            }
            .wr-top-bar {
                font-size: 13px;
                margin-bottom: 8px;
            }
            .wr-status-pill {
                padding: 3px 10px;
                font-size: 12.5px;
            }
            .wr-cardinal-badge {
                font-size: 18px;
                margin-top: 8px;
            }
            .wr-divider {
                margin: 10px 0 12px 0;
            }
            .wr-footer {
                gap: 8px;
                padding-bottom: 8px;
            }
            .wr-temp-val {
                font-size: 36px;
            }
            .wr-temp-unit {
                font-size: 18px;
            }
            .wr-temp-tag {
                font-size: 12px;
            }
            .wr-stall {
                font-size: 16px;
            }
            .wr-row2 {
                font-size: 16px;
            }
        }

        /* ---------------------------------------------------- */
        /* Breites Kachel-Layout (2 Spalten)                   */
        /* ---------------------------------------------------- */
        @media (min-width: 420px) and (max-height: 340px) {
            .wr-container {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 8px 16px;
            }

            .wr-top-bar {
                position: absolute;
                top: 6px;
                right: 12px;
                width: auto;
                gap: 5px;
                margin-bottom: 0;
            }

            .wr-compass-section {
                flex: 0 0 45%;
                max-width: 48%;
                height: 100%;
            }

            .wr-divider {
                width: 1px;
                height: 80%;
                margin: 0;
            }

            .wr-footer {
                flex: 1 1 auto;
                height: 100%;
                justify-content: center;
                gap: 8px;
                padding-bottom: 0;
            }

            .wr-row1 {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
            }

            .wr-row2 {
                flex-direction: column;
                align-items: flex-start;
                gap: 3px;
            }
        }
    </style>
</head>
<body>

    <div class="wr-container" id="weatherContainer">

        <!-- Oben: Optionale Status-Pill (nur bei Regen) -->
        <div class="wr-top-bar empty" id="topBar">
            <div class="wr-status-pill hidden" id="rainPill">
                <span id="rainIcon">🌧️</span>
                <span id="rainText">Regen</span>
            </div>
        </div>

        <!-- Mitte: Dynamische SVG Windrose & Himmelsrichtung -->
        <div class="wr-compass-section">
            <div class="wr-compass-hero">
                <svg class="wr-svg" viewBox="0 0 120 120">
                    <defs>
                        <filter id="wr-shadow" x="-30%" y="-30%" width="160%" height="160%">
                            <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
                        </filter>
                    </defs>

                    <!-- Ziffernblatt / Dial Background passend zu Standard-Kacheln -->
                    <circle cx="60" cy="60" r="56" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
                    <circle cx="60" cy="60" r="53" fill="rgba(0, 0, 0, 0.12)" stroke="rgba(0,0,0,0.3)" stroke-width="0.8" />
                    <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" stroke-dasharray="2,3" />

                    <!-- Haupt-Skalenstriche (N, O, S, W) -->
                    <line x1="60" y1="8" x2="60" y2="15" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" />
                    <line x1="112" y1="60" x2="105" y2="60" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" />
                    <line x1="60" y1="112" x2="60" y2="105" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" />
                    <line x1="8" y1="60" x2="15" y2="60" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" />

                    <!-- Zwischen-Skalenstriche (NO, SO, SW, NW) -->
                    <line x1="60" y1="10" x2="60" y2="14" transform="rotate(45 60 60)" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round" />
                    <line x1="60" y1="10" x2="60" y2="14" transform="rotate(135 60 60)" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round" />
                    <line x1="60" y1="10" x2="60" y2="14" transform="rotate(225 60 60)" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round" />
                    <line x1="60" y1="10" x2="60" y2="14" transform="rotate(315 60 60)" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round" />

                    <!-- Himmelsrichtungs-Buchstaben -->
                    <text x="60" y="24" id="northLetter" fill="#F43F5E" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="central">N</text>
                    <text x="96" y="60" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">O</text>
                    <text x="60" y="96" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">S</text>
                    <text x="24" y="60" fill="#E2E8F0" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">W</text>

                    <!-- Vorherige Windrichtung: Geisterzeiger (optional) -->
                    <g id="ghostNeedle" class="ghost-needle-transition" style="display:none;">
                        <polygon points="60,32 57,60 60,56" fill="rgba(255,255,255,0.3)" />
                        <polygon points="60,32 63,60 60,56" fill="rgba(255,255,255,0.4)" />
                    </g>

                    <!-- Haupt-Windnadel mit 60fps Hardware-Transformation -->
                    <g id="needleGroup" class="needle-transition" filter="url(#wr-shadow)">
                        <!-- Pfeilspitze Norden/Windrichtung -->
                        <polygon id="needleFrontLeft" points="60,28 56,60 60,54" fill="#00CDAB" />
                        <polygon id="needleFrontRight" points="60,28 64,60 60,54" fill="#14F1CD" />
                        <!-- Gegenfahne Süden -->
                        <polygon points="60,92 56,60 60,66" fill="#475569" />
                        <polygon points="60,92 64,60 60,66" fill="#64748B" />
                        <!-- Drehachse / Mittelpunkt -->
                        <circle cx="60" cy="60" r="4.5" fill="#0F172A" id="needleCenterRing" stroke="#00CDAB" stroke-width="1.5" />
                        <circle cx="60" cy="60" r="1.5" fill="#FFFFFF" />
                    </g>
                </svg>
            </div>

            <!-- Himmelsrichtung Label -->
            <div class="wr-cardinal-badge">
                <span id="shortDir">N</span>
                <span class="wr-cardinal-sub" id="cardinalSub">(0°) · Nord</span>
            </div>
        </div>

        <!-- Trennlinie -->
        <div class="wr-divider"></div>

        <!-- Unten: Footer mit Messwerten -->
        <div class="wr-footer">
            <!-- Reihe 1: Haupt-Außentemperatur links, Sekundärtemperatur rechts -->
            <div class="wr-row1">
                <div>
                    <span class="wr-temp-val" id="tempOutdoor">--,-</span>
                    <span class="wr-temp-unit">°C</span>
                    <span class="wr-temp-tag">AUSSEN</span>
                </div>
                <div class="wr-stall" id="secondaryTempWrap">
                    <span id="secondaryTempLabel">Stall</span>: <span class="wr-stall-val" id="tempSecondary">--,- °C</span>
                </div>
            </div>

            <!-- Reihe 2: Windgeschwindigkeit & Böe links, Beaufort rechts -->
            <div class="wr-row2">
                <div class="wr-speed">
                    <span class="wr-speed-main" id="speedVal">0,0 km/h</span>
                    <span id="gustWrap" style="display:none;">
                        <span class="wr-gust" id="gustVal">Böe 0,0</span>
                    </span>
                </div>
                <div class="wr-bft" id="bftVal">0 Bft (Windstille)</div>
            </div>
        </div>

    </div>

    <!-- IP-Symcon HTML-SDK JavaScript Logik -->
    <script>
        /* INITIAL DATA FROM PHP */

        // Zustand für kontinuierliche Drehung (verhindert 350° Rückdreher)
        let currentVisualAngle = 0;
        let currentGhostVisualAngle = 0;

        /**
         * Berechnet den kürzesten Rotationspfad über 360°-Grenzen hinweg.
         */
        function calculateContinuousRotation(targetAngle, currentAngle) {
            targetAngle = ((targetAngle % 360) + 360) % 360;
            let currentNormalized = ((currentAngle % 360) + 360) % 360;
            let diff = targetAngle - currentNormalized;

            if (diff > 180) {
                diff -= 360;
            } else if (diff < -180) {
                diff += 360;
            }
            return currentAngle + diff;
        }

        /**
         * IP-Symcon HTML-SDK Callback für dynamische Updates.
         */
        function handleMessage(data) {
            if (!data) return;

            // 1. IP-Symcon UpdateVisualizationValue übergibt die Daten als JSON-String
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    console.error('WeatherStationTile JSON.parse failed:', e);
                    return;
                }
            }

            // 2. Falls Daten in { value: ... } gewrappt sind (z.B. bei manchen postMessage Implementierungen)
            if (data && typeof data === 'object' && typeof data.value !== 'undefined') {
                if (typeof data.value === 'string') {
                    try { data = JSON.parse(data.value); } catch (e) {}
                } else if (typeof data.value === 'object' && data.value !== null) {
                    data = data.value;
                }
            }

            if (!data || typeof data !== 'object') return;

            // 3. Sicherheits-Check: Nur echte Wetter-Payloads verarbeiten!
            // Verhindert, dass interne Symcon-Nachrichten (Handshake, Theme, Resize) den DOM-Zustand löschen.
            const hasWeatherData = (
                data.windDirection !== undefined ||
                data.degrees !== undefined ||
                data.outdoorTemp !== undefined ||
                data.outdoorTempFormatted !== undefined ||
                data.secondaryTemp !== undefined ||
                data.secondaryTempFormatted !== undefined ||
                data.windSpeed !== undefined ||
                data.windSpeedFormatted !== undefined ||
                data.bft !== undefined
            );
            if (!hasWeatherData) {
                return;
            }

            // 4. Farben & Optionen aktualisieren (falls im Datensatz)
            if (data.colors) {
                if (data.colors.needle) {
                    const elLeft = document.getElementById('needleFrontLeft');
                    const elRing = document.getElementById('needleCenterRing');
                    if (elLeft) elLeft.setAttribute('fill', data.colors.needle);
                    if (elRing) elRing.setAttribute('stroke', data.colors.needle);
                }
                if (data.colors.needleBright) {
                    const elRight = document.getElementById('needleFrontRight');
                    if (elRight) elRight.setAttribute('fill', data.colors.needleBright);
                }
                if (data.colors.north) {
                    const elNorth = document.getElementById('northLetter');
                    if (elNorth) elNorth.setAttribute('fill', data.colors.north);
                }
                if (data.colors.gust) {
                    const elGust = document.getElementById('gustVal');
                    if (elGust) elGust.style.color = data.colors.gust;
                }
            }

            // 5. Windrichtung & kontinuierliche Nadel-Rotation
            const dirVal = (typeof data.windDirection === 'number') 
                ? data.windDirection 
                : ((typeof data.degrees === 'number') ? data.degrees : null);

            if (dirVal !== null) {
                currentVisualAngle = calculateContinuousRotation(dirVal, currentVisualAngle);
                const needle = document.getElementById('needleGroup');
                if (needle) {
                    needle.style.transform = `rotate(${currentVisualAngle}deg)`;
                }
            }

            // Vorherige Windrichtung (Geisterzeiger)
            const ghostNeedle = document.getElementById('ghostNeedle');
            if (ghostNeedle) {
                const prevVal = (typeof data.prevDirection === 'number') 
                    ? data.prevDirection 
                    : ((typeof data.prevDegrees === 'number') ? data.prevDegrees : null);

                if (prevVal !== null && data.options?.showPreviousDirection) {
                    ghostNeedle.style.display = 'block';
                    currentGhostVisualAngle = calculateContinuousRotation(prevVal, currentGhostVisualAngle);
                    ghostNeedle.style.transform = `rotate(${currentGhostVisualAngle}deg)`;
                } else if (data.options && data.options.showPreviousDirection === false) {
                    ghostNeedle.style.display = 'none';
                }
            }

            // Himmelsrichtungs-Text & Grad
            const shortDirEl = document.getElementById('shortDir');
            const cardinalSubEl = document.getElementById('cardinalSub');
            if (shortDirEl && (data.cardinal || data.cardinalShort)) {
                shortDirEl.textContent = data.cardinal || data.cardinalShort;
            }
            if (cardinalSubEl) {
                if (dirVal !== null) {
                    const deg = Math.round(dirVal);
                    const text = data.cardinalText || data.cardinalLong || '';
                    cardinalSubEl.textContent = text ? `(${deg}°) · ${text}` : `(${deg}°)`;
                }
            }

            // 6. Außentemperatur & Sekundärtemperatur (Stall/Wärmepumpe)
            const tempOutdoorEl = document.getElementById('tempOutdoor');
            if (tempOutdoorEl && data.outdoorTempFormatted !== undefined) {
                tempOutdoorEl.textContent = data.outdoorTempFormatted;
            }

            const secTempWrap = document.getElementById('secondaryTempWrap');
            const tempSecondaryEl = document.getElementById('tempSecondary');
            const secLabelEl = document.getElementById('secondaryTempLabel');

            if (secTempWrap) {
                const showSec = (data.options && typeof data.options.showSecondaryTemp !== 'undefined')
                    ? data.options.showSecondaryTemp
                    : true;

                if (!showSec) {
                    secTempWrap.style.display = 'none';
                } else {
                    const secVal = (data.secondaryTempFormatted !== undefined && data.secondaryTempFormatted !== null && data.secondaryTempFormatted !== '--,-')
                        ? data.secondaryTempFormatted
                        : (data.secondaryTemp !== undefined && data.secondaryTemp !== null ? String(data.secondaryTemp).replace('.', ',') : null);

                    if (secVal !== null) {
                        secTempWrap.style.display = 'inline-block';
                        if (tempSecondaryEl) tempSecondaryEl.textContent = `${secVal} °C`;
                        if (secLabelEl && data.secondaryTempLabel) secLabelEl.textContent = data.secondaryTempLabel;
                    }
                }
            }

            // 7. Windgeschwindigkeit, Böe & Beaufort
            const speedValEl = document.getElementById('speedVal');
            if (speedValEl && data.windSpeedFormatted !== undefined) {
                const unit = data.windSpeedUnit || 'km/h';
                speedValEl.textContent = `${data.windSpeedFormatted} ${unit}`;
            }

            const gustWrap = document.getElementById('gustWrap');
            const gustValEl = document.getElementById('gustVal');
            if (gustWrap && gustValEl) {
                const gustVal = (typeof data.gust === 'number')
                    ? data.gust
                    : (data.gustFormatted ? parseFloat(String(data.gustFormatted).replace(',', '.')) : 0);

                const unit = data.gustUnit || data.windSpeedUnit || 'km/h';
                if (data.gustFormatted && gustVal > 0) {
                    gustWrap.style.display = 'inline';
                    gustValEl.textContent = `Böe ${data.gustFormatted} ${unit}`;
                } else if (data.gust !== undefined || data.gustFormatted !== undefined) {
                    gustWrap.style.display = 'none';
                }
            }

            const bftValEl = document.getElementById('bftVal');
            if (bftValEl) {
                const showBft = (data.options && typeof data.options.showBeaufort !== 'undefined')
                    ? data.options.showBeaufort
                    : true;

                if (!showBft) {
                    bftValEl.style.display = 'none';
                } else if (data.bft !== undefined && data.bft !== null) {
                    bftValEl.style.display = 'block';
                    const bftDesc = data.bftText ? ` (${data.bftText})` : '';
                    bftValEl.textContent = `${data.bft} Bft${bftDesc}`;
                }
            }

            // 8. Status-Pills (Regenwarnung bei aktivem Regen)
            const topBar = document.getElementById('topBar');
            const rainPill = document.getElementById('rainPill');
            const rainIcon = document.getElementById('rainIcon');
            const rainText = document.getElementById('rainText');

            let hasPill = false;

            if (rainPill) {
                if (data.options?.showRainStatus && data.rain) {
                    rainPill.classList.remove('hidden');
                    rainPill.classList.add('rain');
                    if (rainIcon) rainIcon.textContent = '🌧️';
                    if (rainText) rainText.textContent = data.rainText || 'Regen';
                    hasPill = true;
                } else {
                    rainPill.classList.add('hidden');
                }
            }

            if (topBar) {
                if (hasPill) {
                    topBar.classList.remove('empty');
                } else {
                    topBar.classList.add('empty');
                }
            }
        }

        window.handleMessage = handleMessage;
        window.updateVisual = handleMessage;

        // Sofortige Ausführung bei Initialisierung
        if (typeof window.__INITIAL_DATA__ !== 'undefined') {
            handleMessage(window.__INITIAL_DATA__);
        }
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.__INITIAL_DATA__ !== 'undefined') {
                handleMessage(window.__INITIAL_DATA__);
            }
        });
