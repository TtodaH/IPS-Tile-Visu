<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wetterstation Tile</title>
    <!-- IP-Symcon Icons / FontAwesome support -->
    <script src="/icons.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --needle-color: #00CDAB;
            --needle-bright: #14F1CD;
            --north-color: #F43F5E;
            --gust-color: #F59E0B;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --card-surface: transparent;
            --divider-color: rgba(255, 255, 255, 0.08);
            --badge-bg: rgba(255, 255, 255, 0.05);
            --badge-border: rgba(255, 255, 255, 0.1);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --text-primary: #0F172A;
                --text-secondary: #475569;
                --text-muted: #94A3B8;
                --divider-color: rgba(0, 0, 0, 0.08);
                --badge-bg: rgba(0, 0, 0, 0.04);
                --badge-border: rgba(0, 0, 0, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
        }

        /* Hauptcontainer mit Container Queries */
        .wr-container {
            container-type: size;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: clamp(6px, 2.5cqw, 14px) clamp(8px, 3cqw, 16px);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Status-Leiste oben (Batterie & Regen) */
        .wr-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-shrink: 0;
            font-size: clamp(9px, 2.8cqw, 11.5px);
            font-weight: 600;
            min-height: 16px;
        }

        .wr-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px;
            border-radius: 12px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--text-secondary);
            transition: all 0.25s ease;
        }

        .wr-status-pill.rain {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #38BDF8;
        }

        .wr-status-pill.battery-warn {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
            color: #F59E0B;
        }

        .wr-status-pill.hidden {
            display: none !important;
        }

        /* Mittlerer Hero-Bereich: Windrose */
        .wr-compass-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            position: relative;
        }

        .wr-svg {
            width: auto;
            height: auto;
            max-width: min(calc(100cqw - 16px), calc(100cqh - 85px));
            max-height: min(calc(100cqw - 16px), calc(100cqh - 85px));
            aspect-ratio: 1 / 1;
            overflow: visible;
        }

        /* Nadelrotation: butterweiche 60fps CSS Transitions */
        .needle-transition {
            transition: transform 0.8s cubic-bezier(0.34, 1.3, 0.64, 1);
            transform-origin: 60px 60px;
        }

        .ghost-needle-transition {
            transition: transform 1.2s ease-out;
            transform-origin: 60px 60px;
            opacity: 0.35;
        }

        /* Himmelsrichtung Badge unter dem Kompass */
        .wr-cardinal-badge {
            font-size: clamp(11.5px, min(3.8cqw, 4cqh), 17px);
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 0.4px;
            line-height: 1.1;
            margin-top: 4px;
            white-space: nowrap;
        }

        .wr-cardinal-sub {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 0.86em;
            margin-left: 2px;
        }

        /* Trennlinie */
        .wr-divider {
            height: 1px;
            background: var(--divider-color);
            width: 100%;
            flex-shrink: 0;
            margin: clamp(4px, 1cqh, 7px) 0;
        }

        /* Footer mit Temperaturen & Windwerten */
        .wr-footer {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex-shrink: 0;
            gap: clamp(2px, 0.8cqh, 5px);
        }

        .wr-row1 {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
        }

        .wr-temp-val {
            font-size: clamp(17px, min(6.5cqw, 6.8cqh), 28px);
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .wr-temp-unit {
            font-size: clamp(11px, min(3.8cqw, 4.2cqh), 16px);
            font-weight: 600;
            color: var(--text-secondary);
            margin-left: 1px;
        }

        .wr-temp-tag {
            font-size: clamp(9px, min(2.7cqw, 3cqh), 11.5px);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 4px;
        }

        .wr-stall {
            font-size: clamp(10.5px, min(3.4cqw, 3.8cqh), 14px);
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .wr-stall-val {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .wr-row2 {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            font-size: clamp(10.5px, min(3.4cqw, 3.8cqh), 14.5px);
            line-height: 1.2;
            white-space: nowrap;
        }

        .wr-wind {
            font-weight: 700;
            color: #38BDF8;
        }

        .wr-wind-secondary {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.86em;
        }

        .wr-gust {
            font-weight: 600;
            color: var(--gust-color);
            margin-left: 5px;
        }

        .wr-bft {
            color: var(--text-secondary);
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="wr-container" id="weatherContainer">

        <!-- Oben: Optionale Status-Pills (Regen/Trocken & Batterie) -->
        <div class="wr-top-bar" id="topBar">
            <div class="wr-status-pill hidden" id="rainPill">
                <span id="rainIcon">☀️</span>
                <span id="rainText">Trocken</span>
            </div>
            <div class="wr-status-pill hidden" id="batteryPill">
                <span id="batteryIcon">🔋</span>
                <span id="batteryText">Batterie OK</span>
            </div>
        </div>

        <!-- Mitte: Dynamische SVG Windrose -->
        <div class="wr-compass-hero">
            <svg class="wr-svg" viewBox="0 0 120 120">
                <defs>
                    <filter id="wr-shadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
                    </filter>
                    <filter id="wr-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="1.5" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Äußere Skalierungsringe -->
                <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
                <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" stroke-dasharray="2,3" />

                <!-- Haupt-Skalenstriche (N, O, S, W) -->
                <line x1="60" y1="8" x2="60" y2="15" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" />
                <line x1="112" y1="60" x2="105" y2="60" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" />
                <line x1="60" y1="112" x2="60" y2="105" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" />
                <line x1="8" y1="60" x2="15" y2="60" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" />

                <!-- Zwischen-Skalenstriche (NO, SO, SW, NW) -->
                <line x1="60" y1="10" x2="60" y2="14" transform="rotate(45 60 60)" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-linecap="round" />
                <line x1="60" y1="10" x2="60" y2="14" transform="rotate(135 60 60)" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-linecap="round" />
                <line x1="60" y1="10" x2="60" y2="14" transform="rotate(225 60 60)" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-linecap="round" />
                <line x1="60" y1="10" x2="60" y2="14" transform="rotate(315 60 60)" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-linecap="round" />

                <!-- Himmelsrichtungs-Buchstaben -->
                <text x="60" y="24" id="northLetter" fill="#F43F5E" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="central">N</text>
                <text x="96" y="60" fill="rgba(255,255,255,0.85)" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">O</text>
                <text x="60" y="96" fill="rgba(255,255,255,0.85)" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">S</text>
                <text x="24" y="60" fill="rgba(255,255,255,0.85)" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">W</text>

                <!-- Vorherige Windrichtung: Geisterzeiger (optional) -->
                <g id="ghostNeedle" class="ghost-needle-transition" style="display:none;" transform="rotate(0 60 60)">
                    <polygon points="60,32 57,60 60,56" fill="rgba(255,255,255,0.3)" />
                    <polygon points="60,32 63,60 60,56" fill="rgba(255,255,255,0.4)" />
                </g>

                <!-- Haupt-Windnadel mit 60fps Hardware-Transformation -->
                <g id="needleGroup" class="needle-transition" filter="url(#wr-shadow)" transform="rotate(0 60 60)">
                    <!-- Pfeilspitze Norden/Windrichtung -->
                    <polygon id="needleFrontLeft" points="60,28 56,60 60,54" fill="#00CDAB" />
                    <polygon id="needleFrontRight" points="60,28 64,60 60,54" fill="#14F1CD" />
                    <!-- Gegenfahne Süden -->
                    <polygon points="60,92 56,60 60,66" fill="#475569" />
                    <polygon points="60,92 64,60 60,66" fill="#64748B" />
                    <!-- Drehachse / Mittelpunkt -->
                    <circle cx="60" cy="60" r="4.5" fill="#0F172A" id="needleCenterRing" stroke="#00CDAB" stroke-width="1.5" />
                    <circle cx="60" cy="60" r="1.5" fill="#FFFFFF" />
                </g>
            </svg>

            <!-- Himmelsrichtung Label -->
            <div class="wr-cardinal-badge">
                <span id="shortDir">N</span>
                <span class="wr-cardinal-sub" id="cardinalSub">(0°) · Nord</span>
            </div>
        </div>

        <div class="wr-divider"></div>

        <!-- Unten: Footer mit Temperaturen und Wind -->
        <div class="wr-footer">
            <!-- Zeile 1: Außentemperatur (WP) & Sekundärsensor (Stall) -->
            <div class="wr-row1">
                <div>
                    <span class="wr-temp-val"><span id="tempOutdoor">--,-</span><span class="wr-temp-unit">°C</span></span>
                    <span class="wr-temp-tag">Außen</span>
                </div>
                <div class="wr-stall" id="secondaryContainer">
                    <span id="secLabel">Stall</span>: <span class="wr-stall-val"><span id="tempSecondary">--,-</span> °C</span>
                </div>
            </div>

            <!-- Zeile 2: Windgeschwindigkeit, Böen & Beaufort -->
            <div class="wr-row2">
                <div>
                    <span class="wr-wind"><span id="speedVal">0,0</span> <span id="speedUnit">km/h</span> <span class="wr-wind-secondary" id="speedSecondary">(0,0 m/s)</span></span>
                    <span class="wr-gust" id="gustContainer"></span>
                </div>
                <div class="wr-bft" id="bftContainer">
                    <span id="bftVal">0</span> Bft (<span id="bftName">Windstille</span>)
                </div>
            </div>
        </div>

    </div>

    <script>
        // Interner Rotationsspeicher für "kürzesten Weg" (unwrapping)
        let currentNeedleRotation = 0;
        let currentGhostRotation = 0;

        /**
         * Verhindert 350-Grad-Überschläge bei Richtungswechsel über 0°/360° hinaus
         */
        function calculateContinuousAngle(newDeg, currentAngle) {
            const normalizedNew = ((newDeg % 360) + 360) % 360;
            const currentMod = ((currentAngle % 360) + 360) % 360;
            let diff = normalizedNew - currentMod;

            if (diff > 180) {
                diff -= 360;
            } else if (diff < -180) {
                diff += 360;
            }

            return currentAngle + diff;
        }

        /**
         * IP-Symcon 7.1+ HTML-SDK Empfängerfunktion
         * Wird bei UpdateVisualizationValue(...) aus dem PHP-Modul aufgerufen.
         * Garantiert flackerfreie, sofortige DOM-Aktualisierung!
         */
        function handleMessage(data) {
            if (!data) return;

            let d = data;
            if (typeof data === 'string') {
                try {
                    d = JSON.parse(data);
                } catch (e) {
                    console.error('Fehler beim Parsen der Wetter-Daten:', e);
                    return;
                }
            }

            const root = document.documentElement;

            // 1. Farbanpassungen dynamisch übernehmen
            if (d.needleColor) {
                root.style.setProperty('--needle-color', d.needleColor);
                const frontLeft = document.getElementById('needleFrontLeft');
                const centerRing = document.getElementById('needleCenterRing');
                if (frontLeft) frontLeft.setAttribute('fill', d.needleColor);
                if (centerRing) centerRing.setAttribute('stroke', d.needleColor);
            }
            if (d.northColor) {
                root.style.setProperty('--north-color', d.northColor);
                const northEl = document.getElementById('northLetter');
                if (northEl) northEl.setAttribute('fill', d.northColor);
            }
            if (d.gustColor) {
                root.style.setProperty('--gust-color', d.gustColor);
            }

            // 2. Windnadel flüssig drehen (ohne Ruckeln und ohne DOM-Neubau)
            if (d.degrees !== undefined && d.degrees !== null) {
                currentNeedleRotation = calculateContinuousAngle(d.degrees, currentNeedleRotation);
                const needleGroup = document.getElementById('needleGroup');
                if (needleGroup) {
                    needleGroup.style.transform = `rotate(${currentNeedleRotation}deg)`;
                }
            }

            // 3. Vorherige Windrichtung (Geisterzeiger)
            const ghostNeedle = document.getElementById('ghostNeedle');
            if (ghostNeedle) {
                if (d.showPreviousDirection && d.prevDegrees !== null && d.prevDegrees !== undefined) {
                    currentGhostRotation = calculateContinuousAngle(d.prevDegrees, currentGhostRotation);
                    ghostNeedle.style.display = 'block';
                    ghostNeedle.style.transform = `rotate(${currentGhostRotation}deg)`;
                } else {
                    ghostNeedle.style.display = 'none';
                }
            }

            // 4. Himmelsrichtungstext
            if (d.cardinalShort !== undefined) {
                document.getElementById('shortDir').textContent = d.cardinalShort;
            }
            if (d.cardinalLong !== undefined && d.degrees !== undefined) {
                document.getElementById('cardinalSub').textContent = `(${Math.round(d.degrees)}°) · ${d.cardinalLong}`;
            }

            // 5. Temperaturen
            if (d.outdoorTemp !== undefined) {
                document.getElementById('tempOutdoor').textContent = d.outdoorTemp;
            }
            const secContainer = document.getElementById('secondaryContainer');
            if (secContainer) {
                if (d.showSecondaryTemp && d.secondaryTemp !== undefined) {
                    secContainer.style.display = 'block';
                    document.getElementById('tempSecondary').textContent = d.secondaryTemp;
                    if (d.secondaryTempLabel) {
                        document.getElementById('secLabel').textContent = d.secondaryTempLabel;
                    }
                } else {
                    secContainer.style.display = 'none';
                }
            }

            // 6. Windgeschwindigkeit & Einheit
            const unit = d.windUnit || 'kmh';
            const speedValEl = document.getElementById('speedVal');
            const speedUnitEl = document.getElementById('speedUnit');
            const speedSecEl = document.getElementById('speedSecondary');

            if (unit === 'ms') {
                speedValEl.textContent = d.speedMS || '0,0';
                speedUnitEl.textContent = 'm/s';
                speedSecEl.textContent = `(${d.speedKMH || '0,0'} km/h)`;
            } else if (unit === 'kn') {
                speedValEl.textContent = d.speedKN || '0,0';
                speedUnitEl.textContent = 'kn';
                speedSecEl.textContent = `(${d.speedKMH || '0,0'} km/h)`;
            } else {
                speedValEl.textContent = d.speedKMH || '0,0';
                speedUnitEl.textContent = 'km/h';
                speedSecEl.textContent = `(${d.speedMS || '0,0'} m/s)`;
            }

            // 7. Böenanzeige
            const gustCont = document.getElementById('gustContainer');
            if (gustCont) {
                if (d.gustActive && d.gustKMH) {
                    const gustVal = (unit === 'ms') ? (d.gustMS + ' m/s') : (d.gustKMH + ' km/h');
                    gustCont.textContent = ` · Böen: ${gustVal}`;
                    gustCont.style.display = 'inline';
                } else {
                    gustCont.textContent = '';
                    gustCont.style.display = 'none';
                }
            }

            // 8. Beaufort-Skala
            const bftCont = document.getElementById('bftContainer');
            if (bftCont) {
                if (d.showBeaufort && d.beaufort !== undefined) {
                    bftCont.style.display = 'block';
                    document.getElementById('bftVal').textContent = d.beaufort;
                    document.getElementById('bftName').textContent = d.beaufortName || '';
                } else {
                    bftCont.style.display = 'none';
                }
            }

            // 9. Regen-Status Pill
            const rainPill = document.getElementById('rainPill');
            if (rainPill) {
                if (d.showRainStatus && d.rainStatus !== null) {
                    rainPill.classList.remove('hidden');
                    if (d.rainStatus === 'rain') {
                        rainPill.classList.add('rain');
                        document.getElementById('rainIcon').textContent = '🌧️';
                        document.getElementById('rainText').textContent = 'Regen';
                    } else {
                        rainPill.classList.remove('rain');
                        document.getElementById('rainIcon').textContent = '☀️';
                        document.getElementById('rainText').textContent = 'Trocken';
                    }
                } else {
                    rainPill.classList.add('hidden');
                }
            }

            // 10. Batterie-Status Pill
            const batPill = document.getElementById('batteryPill');
            if (batPill) {
                if (d.showBatteryStatus && d.batteryOk !== undefined) {
                    if (!d.batteryOk) {
                        batPill.classList.remove('hidden');
                        batPill.classList.add('battery-warn');
                        document.getElementById('batteryIcon').textContent = '⚠️';
                        document.getElementById('batteryText').textContent = 'Batterie schwach';
                    } else {
                        batPill.classList.add('hidden'); // Bei OK dezent ausblenden
                    }
                } else {
                    batPill.classList.add('hidden');
                }
            }
        }

        // Initialdaten verarbeiten falls vorhanden
        if (window.__INITIAL_DATA__) {
            handleMessage(window.__INITIAL_DATA__);
        }
    </script>
</body>
</html>
