<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Garagentor Tile</title>
    <!-- IP-Symcon Theme-Bootstrap: liest die vom Tile-Frame uebergebenen Theme-Farben
         (cardcolor/textcolor/accentcolor) und setzt data-theme="light|dark" VOR dem ersten Paint. -->
    <script>
        (function () {
            'use strict';
            function parseHex(value) {
                if (!value) { return null; }
                var h = String(value).trim();
                if (h.charAt(0) === '#') { h = h.substring(1); }
                if (h.length === 3) {
                    h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
                }
                if (!/^[0-9a-f]{6}$/i.test(h)) { return null; }
                return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
            }
            function luminance(c) {
                function channel(x) { x = x / 255; return (x <= 0.03928) ? (x / 12.92) : Math.pow((x + 0.055) / 1.055, 2.4); }
                return 0.2126 * channel(c.r) + 0.7152 * channel(c.g) + 0.0722 * channel(c.b);
            }
            var params = new URLSearchParams(window.location.search);
            var card = parseHex(params.get('cardcolor'));
            var text = parseHex(params.get('textcolor'));
            var accent = parseHex(params.get('accentcolor'));

            var isLight = null;
            if (card) { isLight = luminance(card) > 0.45; }
            else if (text) { isLight = luminance(text) < 0.45; }
            else if (window.matchMedia) { isLight = window.matchMedia('(prefers-color-scheme: light)').matches; }

            var root = document.documentElement;
            root.setAttribute('data-theme', isLight ? 'light' : 'dark');
            if (card) { root.style.setProperty('--symcon-card', 'rgb(' + card.r + ',' + card.g + ',' + card.b + ')'); }
            if (text) { root.style.setProperty('--symcon-text', 'rgb(' + text.r + ',' + text.g + ',' + text.b + ')'); }
            if (accent) { root.style.setProperty('--symcon-accent', 'rgb(' + accent.r + ',' + accent.g + ',' + accent.b + ')'); }
        })();
    </script>
    <script src="/icons.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-closed: #10B981;
            --color-opening: #38BDF8;
            --color-open: #EF4444;
            --color-closing: #F59E0B;
            --color-stopped: #94A3B8;
            --color-offline: #64748B;
            /* Akzent (wird vom Theme-Bootstrap auf die Symcon-Akzentfarbe gesetzt) */
            --accent: #38BDF8;
            --accent-strong: #38BDF8;
            
            --panel-slat-bg: linear-gradient(180deg, #374151 0%, #1F2937 100%);
            --panel-slat-border: #4B5563;
            --panel-slat-highlight: rgba(255, 255, 255, 0.12);
            --garage-wall: #1E2026;
            --garage-interior: #0F1117;
            
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --text-muted: #64748B;
            
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-border: rgba(255, 255, 255, 0.16);
            --btn-hover: rgba(255, 255, 255, 0.15);
            --btn-active: rgba(255, 255, 255, 0.25);

            /* Zeichenbare Farben des Garagen-SVGs (theme-abhaengig) */
            --wall-top: #262830;
            --wall-bottom: #1B1C22;
            --wall-stroke: #353942;
            --interior-top: #0A0C10;
            --interior-bottom: #15171E;
            --interior-glow: rgba(255, 235, 180, 0.15);
            --floor-line: #252A34;

            /* Roh-Toene des Tors. Die sichtbaren Variablen darunter mischen die
               Zustandsfarbe ein; bei --tint-*: 0% bleibt das Tor neutral. */
            --frame-edge-raw: #3A3D46;
            --frame-mid-raw: #4E525E;
            --slat-1-raw: #3E4450;
            --slat-2-raw: #333842;
            --slat-3-raw: #282C35;
            --slat-4-raw: #1E2127;

            --door-state: #64748B;
            --tint-frame: 0%;
            --tint-slat: 0%;

            --frame-edge: color-mix(in srgb, var(--door-state) var(--tint-frame), var(--frame-edge-raw));
            --frame-mid: color-mix(in srgb, var(--door-state) var(--tint-frame), var(--frame-mid-raw));
            --slat-1: color-mix(in srgb, var(--door-state) var(--tint-slat), var(--slat-1-raw));
            --slat-2: color-mix(in srgb, var(--door-state) var(--tint-slat), var(--slat-2-raw));
            --slat-3: color-mix(in srgb, var(--door-state) var(--tint-slat), var(--slat-3-raw));
            --slat-4: color-mix(in srgb, var(--door-state) var(--tint-slat), var(--slat-4-raw));
            --slat-stroke: #1A1C22;
            --slat-highlight: rgba(255, 255, 255, 0.15);
            --slat-line: #20232B;
            --seal: #111215;
            --hinge: #4B5563;
            --threshold: #31343C;
            --threshold-stroke: #23252B;
            --art-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        /* Helles IP-Symcon Theme */
        :root[data-theme="light"] {
            --accent-strong: #0284C7;
            --text-main: #0F172A;
            --text-sub: #475569;
            --text-muted: #64748B;
            --btn-bg: rgba(15, 23, 42, 0.06);
            --btn-border: rgba(15, 23, 42, 0.14);
            --btn-hover: rgba(15, 23, 42, 0.11);
            --btn-active: rgba(15, 23, 42, 0.17);
            /* Statusfarben abgedunkelt fuer ausreichenden Kontrast auf Weiss */
            --color-closed: #047857;
            --color-opening: #0369A1;
            --color-open: #B91C1C;
            --color-closing: #B45309;
            --color-stopped: #475569;
            --color-offline: #64748B;

            /* Garage in heller Ausfuehrung: Tor bleibt klar vom Innenraum getrennt */
            --wall-top: #EDF0F4;
            --wall-bottom: #DCE1E8;
            --wall-stroke: #C3CAD4;
            --interior-top: #8C97A6;
            --interior-bottom: #A7B1BE;
            --interior-glow: rgba(255, 214, 140, 0.24);
            --floor-line: #8C97A6;

            /* Roh-Toene des Tors, helle Ausfuehrung.
               Der Mischanteil ist hier GROESSER, nicht kleiner: eine Zumischung
               auf hellem Grund wird vom Auge schwaecher wahrgenommen, weil der
               Abstand zur Grundhelligkeit kleiner ist. Mit dem dunklen Anteil
               bliebe das Tor praktisch neutral. */
            --frame-edge-raw: #C6CDD7;
            --frame-mid-raw: #DFE4EB;
            --slat-1-raw: #F5F7FA;
            --slat-2-raw: #EAEEF3;
            --slat-3-raw: #DDE2EA;
            --slat-4-raw: #CDD4DE;

            --tint-frame-scale: 1.5;
            --tint-slat-scale: 1.35;

            --frame-edge: color-mix(in srgb, var(--door-state) calc(var(--tint-frame) * var(--tint-frame-scale)), var(--frame-edge-raw));
            --frame-mid: color-mix(in srgb, var(--door-state) calc(var(--tint-frame) * var(--tint-frame-scale)), var(--frame-mid-raw));
            --slat-1: color-mix(in srgb, var(--door-state) calc(var(--tint-slat) * var(--tint-slat-scale)), var(--slat-1-raw));
            --slat-2: color-mix(in srgb, var(--door-state) calc(var(--tint-slat) * var(--tint-slat-scale)), var(--slat-2-raw));
            --slat-3: color-mix(in srgb, var(--door-state) calc(var(--tint-slat) * var(--tint-slat-scale)), var(--slat-3-raw));
            --slat-4: color-mix(in srgb, var(--door-state) calc(var(--tint-slat) * var(--tint-slat-scale)), var(--slat-4-raw));
            --slat-stroke: #B7C0CC;
            --slat-highlight: rgba(255, 255, 255, 0.9);
            --slat-line: #C2C9D4;
            --seal: #AEB6C1;
            --hinge: #8C97A6;
            --threshold: #D3D9E1;
            --threshold-stroke: #B9C1CC;
            --art-shadow: 0 3px 8px rgba(15, 23, 42, 0.18);
        }

        /* Helle Feinanpassungen fuer Bedienelemente */
        :root[data-theme="light"] .status-pill {
            background: rgba(16, 185, 129, 0.10);
            border-color: color-mix(in srgb, currentColor 40%, transparent);
        }
        :root[data-theme="light"] .status-pill .status-dot {
            background-color: currentColor;
        }

        :root[data-theme="light"] .preset-btn {
            border-color: rgba(15, 23, 42, 0.12);
            background: rgba(15, 23, 42, 0.04);
        }
        :root[data-theme="light"] .preset-btn:hover {
            background: rgba(15, 23, 42, 0.09);
            border-color: rgba(15, 23, 42, 0.22);
        }
        :root[data-theme="light"] .preset-btn.active-target {
            border-color: var(--accent-strong, #0284C7);
            color: var(--accent-strong, #0284C7);
            background: rgba(2, 132, 199, 0.12);
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.2);
        }
        :root[data-theme="light"] .action-button:hover {
            border-color: rgba(15, 23, 42, 0.22);
        }
        :root[data-theme="light"] .action-button.impulse-active {
            border-color: var(--accent-strong, #0284C7) !important;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.3);
        }
        :root[data-theme="light"] .impulse-indicator {
            color: var(--accent-strong, #0284C7);
        }
        :root[data-theme="light"] .impulse-dot {
            background: var(--accent-strong, #0284C7);
            box-shadow: 0 0 6px rgba(2, 132, 199, 0.55);
        }
        :root[data-theme="light"] .open-duration.warning {
            color: #B45309;
        }
        :root[data-theme="light"] .offline-pill {
            color: #B91C1C;
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
        }

        .tile-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px 6px 12px;
            box-sizing: border-box;
            position: relative;
        }

        /* 1. Platzhalter für IP-Symcon Kachel-Header (Titel links & Vollbild-Icon rechts) */
        .symcon-header-spacer {
            width: 100%;
            height: 18px;
            flex: 0 0 auto;
        }

        /* 2. Side-by-Side Inhaltszeile: Robustes 2-Spalten Grid */
        .tile-content-row {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 148px;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        /* Linke Spalte: Tor-Visualisierung mit Container Queries */
        .garage-col {
            height: 100%;
            width: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            container-type: size;
        }

        /* Rechte Spalte: Steuerungselemente */
        .controls-col {
            width: 148px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            min-width: 0;
            box-sizing: border-box;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            flex: 0 0 auto;
        }

        .offline-pill {
            display: none;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1.5px 6px;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.2);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: var(--color-closed);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        .pulsing .status-dot {
            animation: pulse-glow 1.4s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 4px currentColor); }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* 2. Visual Garage Center: Skaliert automatisch und proportional (3:2) */
        .garage-svg-wrap {
            width: min(100cqw, calc(100cqh * 1.5));
            height: min(100cqh, calc(100cqw / 1.5));
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 180 / 120;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease, filter 0.15s ease;
            outline: none;
            border-radius: 8px;
        }

        .garage-svg-wrap:hover {
            filter: brightness(1.08);
        }

        .garage-svg-wrap:focus-visible {
            outline: 2px solid var(--color-opening);
            outline-offset: 3px;
        }

        .garage-svg-wrap:active {
            transform: scale(0.975);
        }

        .garage-svg-wrap.impulse-active .garage-svg {
            animation: door-impulse-glow 0.8s ease-out;
        }

        @keyframes door-impulse-glow {
            0% { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.7)); }
            100% { filter: drop-shadow(var(--art-shadow)); }
        }

        .garage-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(var(--art-shadow));
            transition: filter 0.25s ease;
        }

        /* Slats sliding animation */
        #doorSlatsGroup {
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.25, 1);
        }

        /* Arrow motion animations */
        .motion-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
            width: clamp(34px, 14cqw, 56px);
            height: clamp(34px, 14cqw, 56px);
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .motion-arrow-svg {
            width: 20px;
            height: 20px;
        }

        .motion-indicator.moving-up {
            color: var(--color-opening);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .motion-indicator.moving-up .motion-arrow-svg {
            animation: floatUp 1.1s infinite ease-in-out;
        }

        .motion-indicator.moving-down {
            color: var(--color-closing);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .motion-indicator.moving-down .motion-arrow-svg {
            animation: floatDown 1.1s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(5px); opacity: 0.3; }
            50% { opacity: 1; }
            100% { transform: translateY(-5px); opacity: 0.3; }
        }

        @keyframes floatDown {
            0% { transform: translateY(-5px); opacity: 0.3; }
            50% { opacity: 1; }
            100% { transform: translateY(5px); opacity: 0.3; }
        }

        /* Position Badge Overlay */
        .pos-badge {
            position: absolute;
            bottom: calc(6.7% + 3px);
            right: calc(4.5% + 3px);
            font-size: clamp(10px, 3cqw, 15px);
            font-weight: 700;
            color: #F8FAFC;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 1.5px 6px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            letter-spacing: 0.2px;
            pointer-events: none;
        }

        /* 3. Footer / Button & Meta Row */
        .action-button {
            width: 100%;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            position: relative;
            overflow: hidden;
            padding: 0 6px;
            flex: 0 0 auto;
        }

        .action-button:hover {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .action-button:active {
            transform: scale(0.97);
            background: var(--btn-active);
        }

        .action-button.impulse-active {
            animation: impulse-flash 0.8s ease-out;
            border-color: #38BDF8 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        @keyframes impulse-flash {
            0% { background: rgba(56, 189, 248, 0.35); }
            100% { background: var(--btn-bg); }
        }

        .btn-svg {
            width: 14px;
            height: 14px;
            display: inline-block;
            vertical-align: middle;
            fill: currentColor;
            flex-shrink: 0;
        }

        .preset-svg {
            width: 13px;
            height: 13px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Presets Row */
        .presets-row {
            width: 100%;
            display: flex;
            gap: 5px;
            justify-content: center;
            flex: 0 0 auto;
        }

        .preset-btn {
            flex: 1 1 0;
            min-width: 0;
            height: 27px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            padding: 0 4px;
            white-space: nowrap;
            overflow: hidden;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            color: var(--text-main);
        }

        .preset-btn:active {
            transform: scale(0.96);
        }

        .preset-btn.active-target {
            border-color: #38BDF8;
            color: #38BDF8;
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
        }

        .preset-btn.impulse-active {
            animation: impulse-flash 0.8s ease-out;
            border-color: #38BDF8 !important;
        }

        .preset-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
        }

        .preset-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-sub);
            min-height: 14px;
            padding: 0 2px;
            flex: 0 0 auto;
        }

        @media (max-width: 330px) {
            .tile-content-row {
                grid-template-columns: minmax(0, 1fr) 130px;
                gap: 6px;
            }
            .controls-col {
                width: 130px;
                gap: 4px;
            }
            .action-button {
                height: 32px;
                font-size: 11px;
            }
            .preset-btn {
                height: 25px;
                font-size: 10px;
            }
        }

        .open-duration {
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .open-duration.warning {
            color: #F59E0B;
            font-weight: 600;
        }

        .impulse-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #38BDF8;
            opacity: 0;
            transition: opacity 0.25s;
        }

        .impulse-indicator.active {
            opacity: 1;
        }

        .impulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #38BDF8;
            box-shadow: 0 0 6px #38BDF8;
        }
    </style>
</head>
<body>
    <div class="tile-wrapper">
        <!-- 1. Platzhalter für IP-Symcon Titel & Expand-Icon -->
        <div class="symcon-header-spacer"></div>

        <!-- 2. Hauptinhalt: 2-Spalten Layout (Tor links, Steuerung rechts) -->
        <div class="tile-content-row">
            <!-- Linke Spalte: Sektionaltor-Grafik -->
            <div class="garage-col">
                <div class="garage-svg-wrap" id="garageDoorWrap" role="button" tabindex="0" onclick="handleDoorClick()" onkeydown="handleDoorKeyDown(event)" title="Garagentor bedienen" aria-label="Garagentor bedienen">
                    <svg class="garage-svg" viewBox="0 0 180 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Clip-Pfad für den Torrahmen (damit hochfahrende Lamellen oben sauber abgeschnitten werden) -->
                        <clipPath id="doorOpeningClip">
                            <rect x="22" y="20" width="136" height="88" rx="2" />
                        </clipPath>

                        <!-- Farbverlauf Garagenwand -->
                        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="var(--wall-top)" />
                            <stop offset="100%" stop-color="var(--wall-bottom)" />
                        </linearGradient>

                        <!-- Farbverlauf Torrahmen -->
                        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="var(--frame-edge)" />
                            <stop offset="50%" stop-color="var(--frame-mid)" />
                            <stop offset="100%" stop-color="var(--frame-edge)" />
                        </linearGradient>

                        <!-- Farbverlauf Torinnenraum -->
                        <linearGradient id="interiorGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="var(--interior-top)" />
                            <stop offset="100%" stop-color="var(--interior-bottom)" />
                        </linearGradient>

                        <!-- Farbverlauf Sektional-Lamelle -->
                        <linearGradient id="slatGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="var(--slat-1)" />
                            <stop offset="12%" stop-color="var(--slat-2)" />
                            <stop offset="88%" stop-color="var(--slat-3)" />
                            <stop offset="100%" stop-color="var(--slat-4)" />
                        </linearGradient>
                    </defs>

                    <!-- Äußere Garage / Wand -->
                    <rect x="8" y="8" width="164" height="104" rx="6" fill="url(#wallGrad)" stroke="var(--wall-stroke)" stroke-width="1.5" />

                    <!-- Sturz & Laibung (Torrahmen) -->
                    <rect x="18" y="16" width="144" height="96" rx="4" fill="url(#frameGrad)" />

                    <!-- Garagen-Innenraum (wird bei offenem Tor sichtbar) -->
                    <rect x="22" y="20" width="136" height="88" rx="2" fill="url(#interiorGrad)" />

                    <!-- Details im Innenraum: Bodenlinie & dezentes Scheinwerferlicht -->
                    <line x1="22" y1="104" x2="158" y2="104" stroke="var(--floor-line)" stroke-width="2" />
                    <!-- Deckenleuchte / Ambient-Glow im Garageninneren -->
                    <ellipse cx="90" cy="22" rx="30" ry="4" fill="var(--interior-glow)" />

                    <!-- Sektionaltor-Lamellen (innerhalb des Clip-Pfades) -->
                    <g clip-path="url(#doorOpeningClip)">
                        <g id="doorSlatsGroup" transform="translate(0, 0)">
                            <!-- Lamelle 1 (Oberste) -->
                            <rect x="23" y="21" width="134" height="20" rx="1.5" fill="url(#slatGrad)" stroke="var(--slat-stroke)" stroke-width="0.75" />
                            <line x1="25" y1="22" x2="155" y2="22" stroke="var(--slat-highlight)" stroke-width="0.75" />
                            <line x1="25" y1="31" x2="155" y2="31" stroke="var(--slat-line)" stroke-width="0.5" />

                            <!-- Lamelle 2 -->
                            <rect x="23" y="43" width="134" height="20" rx="1.5" fill="url(#slatGrad)" stroke="var(--slat-stroke)" stroke-width="0.75" />
                            <line x1="25" y1="44" x2="155" y2="44" stroke="var(--slat-highlight)" stroke-width="0.75" />
                            <line x1="25" y1="53" x2="155" y2="53" stroke="var(--slat-line)" stroke-width="0.5" />

                            <!-- Lamelle 3 -->
                            <rect x="23" y="65" width="134" height="20" rx="1.5" fill="url(#slatGrad)" stroke="var(--slat-stroke)" stroke-width="0.75" />
                            <line x1="25" y1="66" x2="155" y2="66" stroke="var(--slat-highlight)" stroke-width="0.75" />
                            <line x1="25" y1="75" x2="155" y2="75" stroke="var(--slat-line)" stroke-width="0.5" />

                            <!-- Lamelle 4 (Unterste mit Gummidichtung) -->
                            <rect x="23" y="87" width="134" height="21" rx="1.5" fill="url(#slatGrad)" stroke="var(--slat-stroke)" stroke-width="0.75" />
                            <line x1="25" y1="88" x2="155" y2="88" stroke="var(--slat-highlight)" stroke-width="0.75" />
                            <line x1="25" y1="97" x2="155" y2="97" stroke="var(--slat-line)" stroke-width="0.5" />
                            <!-- Bodenabschlussdichtung -->
                            <rect x="23" y="105" width="134" height="3" fill="var(--seal)" />

                            <!-- Beschläge / Scharniere an den Seiten -->
                            <circle cx="28" cy="43" r="1.5" fill="var(--hinge)" />
                            <circle cx="152" cy="43" r="1.5" fill="var(--hinge)" />
                            <circle cx="28" cy="65" r="1.5" fill="var(--hinge)" />
                            <circle cx="152" cy="65" r="1.5" fill="var(--hinge)" />
                            <circle cx="28" cy="87" r="1.5" fill="var(--hinge)" />
                            <circle cx="152" cy="87" r="1.5" fill="var(--hinge)" />
                        </g>
                    </g>

                    <!-- Bodenschwelle vorne -->
                    <rect x="18" y="108" width="144" height="4" fill="var(--threshold)" stroke="var(--threshold-stroke)" stroke-width="0.5" />
                </svg>

                <!-- Bewegungs-Pfeile Overlay -->
                <div class="motion-indicator" id="motionIndicator">
                    <svg class="motion-arrow-svg" id="motionSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline id="motionPolyline" points="18 15 12 9 6 15"></polyline>
                    </svg>
                </div>

                <!-- Prozentanzeige Badge -->
                <div class="pos-badge" id="posBadge">0 %</div>
            </div>
        </div>

        <!-- Rechte Spalte: Steuerungselemente -->
        <div class="controls-col">
                <!-- Status Badge & Offline Pill -->
                <div class="status-row">
                    <span class="offline-pill" id="offlinePill">Offline</span>
                    <div class="status-pill" id="statusPill">
                        <span class="status-dot"></span>
                        <span id="statusText">Geschlossen</span>
                    </div>
                </div>

                <!-- Haupt-Bedientaste -->
                <button class="action-button" id="triggerBtn" onclick="handleDoorClick()">
                    <svg class="btn-svg" id="btnSvg" viewBox="0 0 24 24" fill="currentColor">
                        <path id="btnSvgPath" d="M12 5l7 7H5z"/>
                    </svg>
                    <span id="btnText">Öffnen</span>
                </button>

                <!-- Presets Row (Lüften & Custom) -->
                <div class="presets-row" id="presetsRow">
                    <button class="preset-btn" id="presetVentBtn" onclick="handlePresetClick('ventilation')" title="In Lüftungsstellung fahren">
                        <svg class="preset-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
                        </svg>
                        <span class="preset-label" id="presetVentLabel">15%</span>
                    </button>
                    <button class="preset-btn" id="presetCustomBtn" onclick="handlePresetClick('custom')" title="Preset anfahren">
                        <svg class="preset-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="21" x2="4" y2="14"></line>
                            <line x1="4" y1="10" x2="4" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12" y2="3"></line>
                            <line x1="20" y1="21" x2="20" y2="16"></line>
                            <line x1="20" y1="12" x2="20" y2="3"></line>
                            <line x1="1" y1="14" x2="7" y2="14"></line>
                            <line x1="9" y1="8" x2="15" y2="8"></line>
                            <line x1="17" y1="16" x2="23" y2="16"></line>
                        </svg>
                        <span class="preset-label" id="presetCustomLabel">50%</span>
                    </button>
                </div>

                <!-- Meta-Zeile: Dauer & Taster-Aktivität -->
                <div class="meta-row">
                    <div class="open-duration" id="openDurationWrap" style="display: none;">
                        <span id="openDurationIcon">⏱</span>
                        <span id="openDurationText"></span>
                    </div>
                    <div class="impulse-indicator" id="impulseIndicator">
                        <span class="impulse-dot"></span>
                        <span>Impuls</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDoorState = 'closed';

        /**
         * Dunkelt eine Statusfarbe im hellen Theme ab, damit Text auf hellem
         * Kachel-Hintergrund lesbar bleibt (Kontrast >= 4.5:1).
         */
        function themeColor(hex) {
            if (document.documentElement.getAttribute('data-theme') !== 'light') {
                return hex;
            }
            const match = /^#([0-9a-f]{6})$/i.exec(hex || '');
            if (!match) {
                return hex;
            }
            const n = parseInt(match[1], 16);
            const factor = 0.62;
            const r = Math.round(((n >> 16) & 255) * factor);
            const g = Math.round(((n >> 8) & 255) * factor);
            const b = Math.round((n & 255) * factor);
            return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
        }

        function handleDoorClick() {
            const btn = document.getElementById('triggerBtn');
            if (btn) {
                btn.classList.add('impulse-active');
                setTimeout(() => {
                    btn.classList.remove('impulse-active');
                }, 800);
            }

            const doorWrap = document.getElementById('garageDoorWrap');
            if (doorWrap) {
                doorWrap.classList.add('impulse-active');
                setTimeout(() => {
                    doorWrap.classList.remove('impulse-active');
                }, 800);
            }

            // Aufruf der nativen IP-Symcon Aktion
            if (typeof requestAction === 'function') {
                requestAction('triggerDoor', true);
            } else {
                console.log("requestAction('triggerDoor', true) triggered (Web SDK Preview)");
            }
        }

        function handleDoorKeyDown(event) {
            if (event.key === 'Enter' || event.key === ' ' || event.code === 'Space') {
                event.preventDefault();
                handleDoorClick();
            }
        }

        function handlePresetClick(type) {
            const btn = (type === 'ventilation') ? document.getElementById('presetVentBtn') : document.getElementById('presetCustomBtn');
            if (btn) {
                btn.classList.add('impulse-active');
                setTimeout(() => {
                    btn.classList.remove('impulse-active');
                }, 800);
            }

            if (typeof requestAction === 'function') {
                if (type === 'ventilation') {
                    requestAction('triggerPresetVentilation', true);
                } else if (type === 'custom') {
                    requestAction('triggerCustomPreset', true);
                }
            } else {
                console.log(`requestAction('${type === 'ventilation' ? 'triggerPresetVentilation' : 'triggerCustomPreset'}', true) triggered`);
            }
        }

        function handleMessage(data) {
            if (!data) return;

            // Sicheres Parsen bei JSON-Strings aus WebSocket
            if (typeof data === 'string') {
                try {
                    data = JSON.parse(data);
                } catch (e) {
                    console.error("Fehler beim Parsen der Visualisierungsdaten:", e, data);
                    return;
                }
            }

            // 1. Online / Offline Status
            const offlinePill = document.getElementById('offlinePill');
            if (offlinePill) {
                offlinePill.style.display = (data.isOnline === false && data.options?.showReachableBadge) ? 'inline-block' : 'none';
            }

            // 3. Status Pill & Farben
            const statusPill = document.getElementById('statusPill');
            const statusText = document.getElementById('statusText');
            if (statusPill && statusText) {
                statusText.textContent = data.stateText || 'Unbekannt';
                const col = themeColor(data.stateColor || '#10B981');
                statusPill.style.color = col;
                statusPill.style.borderColor = col + '55';
                statusPill.style.backgroundColor = col + '22';

                if (data.state === 'opening' || data.state === 'closing') {
                    statusPill.classList.add('pulsing');
                } else {
                    statusPill.classList.remove('pulsing');
                }

                // Torgrafik in der Zustandsfarbe toenen.
                //
                // GEMISCHT, nicht ersetzt: die Grautoene tragen die Schattierung
                // der Lamellen. Ein Ersetzen wuerde das Tor zu einem Farbblock
                // machen. Bei unbekanntem Zustand bleibt der Anteil bei 0 %, das
                // Tor also neutral — dann ist keine Aussage ueber offen oder zu
                // moeglich, und eine Faerbung wuerde eine vortaeuschen.
                const root = document.documentElement;
                const known = (data.state === 'open' || data.state === 'closed' ||
                               data.state === 'opening' || data.state === 'closing');

                root.style.setProperty('--door-state', col);
                root.style.setProperty('--tint-frame', known ? '30%' : '0%');
                root.style.setProperty('--tint-slat', known ? '18%' : '0%');
            }

            // 4. Torposition & Sektionaltor-Verschiebung
            // Die Toröffnung im SVG ist 88px hoch.
            // Bei 0% ist translateY(0), bei 100% ist translateY(-88px).
            const pos = (typeof data.position === 'number') ? Math.max(0, Math.min(100, data.position)) : 0;
            const slatsGroup = document.getElementById('doorSlatsGroup');
            if (slatsGroup) {
                const maxTravelPx = 88;
                const offsetPx = (pos / 100) * maxTravelPx;
                slatsGroup.setAttribute('transform', `translate(0, -${offsetPx.toFixed(1)})`);
            }

            // Prozent-Badge
            const posBadge = document.getElementById('posBadge');
            if (posBadge) {
                if (data.options?.showPercentage !== false) {
                    posBadge.style.display = 'block';
                    posBadge.textContent = data.positionFormatted || `${Math.round(pos)} %`;
                } else {
                    posBadge.style.display = 'none';
                }
            }

            // 5. Bewegungs-Pfeile
            const motionWrap = document.getElementById('motionIndicator');
            const motionPolyline = document.getElementById('motionPolyline');
            if (motionWrap && motionPolyline) {
                if (data.state === 'opening') {
                    motionWrap.style.display = 'flex';
                    motionWrap.className = 'motion-indicator moving-up';
                    motionPolyline.setAttribute('points', '18 15 12 9 6 15'); // Chevron Up
                } else if (data.state === 'closing') {
                    motionWrap.style.display = 'flex';
                    motionWrap.className = 'motion-indicator moving-down';
                    motionPolyline.setAttribute('points', '6 9 12 15 18 9'); // Chevron Down
                } else {
                    motionWrap.style.display = 'none';
                }
            }

            // 6. Action Button Text, Icon & State styling
            const btnText = document.getElementById('btnText');
            const btnSvgPath = document.getElementById('btnSvgPath');
            const triggerBtn = document.getElementById('triggerBtn');
            const doorWrap = document.getElementById('garageDoorWrap');
            const actionLabel = data.buttonText || 'Öffnen';

            if (doorWrap) {
                doorWrap.title = `Garagentor: ${actionLabel}`;
                doorWrap.setAttribute('aria-label', `Garagentor ${data.stateText ? '(' + data.stateText + ')' : ''}: Klicken zum ${actionLabel}`);
            }
            if (btnText) {
                btnText.textContent = actionLabel;
            }
            if (triggerBtn && data.stateColor) {
                // Feine Umrandung passend zum Zustand
                triggerBtn.style.borderColor = themeColor(data.stateColor) + '55';
            }
            if (btnSvgPath) {
                if (data.state === 'closed') {
                    btnSvgPath.setAttribute('d', 'M12 5l7 7H5z'); // Up arrow
                } else if (data.state === 'open') {
                    btnSvgPath.setAttribute('d', 'M12 19l-7-7h14z'); // Down arrow
                } else if (data.state === 'opening' || data.state === 'closing') {
                    btnSvgPath.setAttribute('d', 'M6 6h12v12H6z'); // Stop square
                } else {
                    btnSvgPath.setAttribute('d', 'M5 17h14v2H5zm7-12l7 7H5z'); // Step / Eject
                }
            }

            // 7. Impuls-Indikator
            const impulseInd = document.getElementById('impulseIndicator');
            if (impulseInd) {
                if (data.impulseActive) {
                    impulseInd.classList.add('active');
                } else {
                    impulseInd.classList.remove('active');
                }
            }
            if (doorWrap) {
                if (data.impulseActive) {
                    doorWrap.classList.add('impulse-active');
                } else {
                    doorWrap.classList.remove('impulse-active');
                }
            }

            // 8. Offen-Dauer
            const openWrap = document.getElementById('openDurationWrap');
            const openText = document.getElementById('openDurationText');
            if (openWrap && openText) {
                if (data.options?.showOpenDuration && data.openDurationText && data.state !== 'closed') {
                    openWrap.style.display = 'flex';
                    openText.textContent = data.openDurationText;
                    if (data.isWarning) {
                        openWrap.classList.add('warning');
                    } else {
                        openWrap.classList.remove('warning');
                    }
                } else {
                    openWrap.style.display = 'none';
                }
            }

            // 9. Presets (Lüftung & Custom)
            if (data.presets) {
                const ventBtn = document.getElementById('presetVentBtn');
                const ventLabel = document.getElementById('presetVentLabel');
                const customBtn = document.getElementById('presetCustomBtn');
                const customLabel = document.getElementById('presetCustomLabel');

                if (ventBtn && ventLabel && data.presets.ventilation) {
                    ventLabel.textContent = data.presets.ventilation.label || '15%';
                    if (data.presets.ventilation.title) {
                        ventBtn.title = data.presets.ventilation.title;
                    }
                    if (data.presets.ventilation.active) {
                        ventBtn.classList.add('active-target');
                    } else {
                        ventBtn.classList.remove('active-target');
                    }
                }

                if (customBtn && customLabel && data.presets.custom) {
                    if (data.presets.custom.enabled !== false) {
                        customBtn.style.display = 'inline-flex';
                        customLabel.textContent = data.presets.custom.label || '50%';
                        if (data.presets.custom.title) {
                            customBtn.title = data.presets.custom.title;
                        }
                        if (data.presets.custom.active) {
                            customBtn.classList.add('active-target');
                        } else {
                            customBtn.classList.remove('active-target');
                        }
                    } else {
                        customBtn.style.display = 'none';
                    }
                }
            }

            currentDoorState = data.state;
        }

        window.handleMessage = handleMessage;
        window.updateVisual = handleMessage;

        // Initiale Daten ausführen falls vom PHP-Backend eingebettet
        if (typeof window.__INITIAL_DATA__ !== 'undefined') {
            handleMessage(window.__INITIAL_DATA__);
        }
    </script>
</body>
</html>
