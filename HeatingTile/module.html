<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Heizung Tile</title>
    <!-- IP-Symcon Theme-Bootstrap: liest die vom Tile-Frame uebergebenen Theme-Farben
         (cardcolor/textcolor/accentcolor) und setzt data-theme="light|dark" VOR dem ersten Paint. -->
    <script>
        (function () {
            'use strict';
            function parseHex(value) {
                if (!value) { return null; }
                var h = String(value).trim();
                if (h.charAt(0) === '#') { h = h.substring(1); }
                if (h.length === 3) {
                    h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
                }
                if (!/^[0-9a-f]{6}$/i.test(h)) { return null; }
                return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
            }
            function luminance(c) {
                function channel(x) { x = x / 255; return (x <= 0.03928) ? (x / 12.92) : Math.pow((x + 0.055) / 1.055, 2.4); }
                return 0.2126 * channel(c.r) + 0.7152 * channel(c.g) + 0.0722 * channel(c.b);
            }
            var params = new URLSearchParams(window.location.search);
            var card = parseHex(params.get('cardcolor'));
            var text = parseHex(params.get('textcolor'));
            var accent = parseHex(params.get('accentcolor'));

            var isLight = null;
            if (card) { isLight = luminance(card) > 0.45; }
            else if (text) { isLight = luminance(text) < 0.45; }
            else if (window.matchMedia) { isLight = window.matchMedia('(prefers-color-scheme: light)').matches; }

            var root = document.documentElement;
            root.setAttribute('data-theme', isLight ? 'light' : 'dark');
            if (card) { root.style.setProperty('--symcon-card', 'rgb(' + card.r + ',' + card.g + ',' + card.b + ')'); }
            if (text) { root.style.setProperty('--symcon-text', 'rgb(' + text.r + ',' + text.g + ',' + text.b + ')'); }
            if (accent) { root.style.setProperty('--symcon-accent', 'rgb(' + accent.r + ',' + accent.g + ',' + accent.b + ')'); }
        })();
    </script>

    <style>
        :root {
            --panel-bg: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.12);
            --ring-track: rgba(255, 255, 255, 0.10);

            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --text-muted: #64748B;

            --color-heating: #EF4444;
            --color-holding: #10B981;
            --color-idle: #64748B;
            --color-overshoot: #F59E0B;

            /* Temperaturskala des Rings: kalt -> warm.
               Bewusst mehrstufig: eine direkte Interpolation von Blau nach Rot
               ergibt in der Mitte Violett, was bei einer Temperaturanzeige
               falsch wirkt. Der Zwischenpunkt ist neutral. */
            --grad-0: #3B82F6;
            --grad-1: #7DD3FC;
            --grad-2: #94A3B8;
            --grad-3: #FB923C;
            --grad-4: #EF4444;
            /* Nicht gefuellter Teil des Rings: blasse Vorschau der Skala */
            --grad-rest: 0.16;

            --state-color: var(--color-idle);

            /* Werden per JS aus der echten Kachelgroesse gesetzt */
            --fs-temp: 38px;
            --fs-sub: 11px;
            --fs-title: 13px;
            --fs-pill: 10px;
            --fs-setpoint: 14px;
            --ring-size: 120px;
            --thumb-r: 6;
            --ring-stroke: 8;
            --gap: 6px;
            --spacer-h: 18px;
        }

        :root[data-theme="light"] {
            --panel-bg: rgba(15, 23, 42, 0.05);
            --panel-border: rgba(15, 23, 42, 0.12);
            --ring-track: rgba(15, 23, 42, 0.10);

            --text-main: #0F172A;
            --text-sub: #475569;
            --text-muted: #64748B;

            --color-heating: #B91C1C;
            --color-holding: #047857;
            --color-idle: #475569;
            --color-overshoot: #B45309;

            /* Auf hellem Grund braucht die Skala mehr Tiefe */
            --grad-0: #2563EB;
            --grad-1: #38BDF8;
            --grad-2: #64748B;
            --grad-3: #EA580C;
            --grad-4: #DC2626;
            --grad-rest: 0.22;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: transparent;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* Platzhalter fuer den Titel, den IP-Symcon selbst ueber die Kachel
           zeichnet (Instanzname). Ohne diesen Platz ueberlappt Symcons Titel
           mit dem eigenen Kachelinhalt. */
        .symcon-header-spacer {
            width: 100%;
            flex: 0 0 auto;
            height: var(--spacer-h, 18px);
        }

        .tile {
            width: 100%;
            height: 100%;
            padding: 4px 10px 6px;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            min-height: 0;
            overflow: hidden;
        }

        /* ---------- Kopf ---------- */

        .tile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 0 0 auto;
            min-width: 0;
        }

        .tile-title {
            font-size: var(--fs-title);
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1 1 auto;
            min-width: 0;
        }

        .state-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: var(--fs-pill);
            font-weight: 700;
            line-height: 1.3;
            white-space: nowrap;
            flex: 0 0 auto;
            color: var(--state-color);
            background: color-mix(in srgb, var(--state-color) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--state-color) 32%, transparent);
            transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .state-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--state-color);
        }

        .state-pill.is-heating .state-dot {
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.3; transform: scale(0.75); }
        }

        /* ---------- Ring ---------- */

        /* Ring und Sollwert-Pille stehen im normalen Fluss untereinander.
           Eine absolut positionierte Pille haette immer einen Leerraum
           erzeugt, sobald der Ring kleiner als die Flaeche ist. */
        .ring-area {
            flex: 1 1 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 0;
            min-width: 0;
        }

        .ring-wrap {
            position: relative;
            flex: 0 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            min-width: 0;
        }

        .ring-svg {
            width: var(--ring-size);
            height: var(--ring-size);
            display: block;
            touch-action: none;
            cursor: pointer;
            overflow: visible;
        }

        .ring-track {
            fill: none;
            stroke: var(--ring-track);
            stroke-width: var(--ring-stroke);
            stroke-linecap: round;
        }

        /* Ringfuellung als Farbverlauf kalt -> warm.

           Ein einzelner linearer SVG-Verlauf kann einen 270-Grad-Bogen nicht
           sauber abbilden: Anfang und Ende liegen beide unten, der Scheitel
           oben. Deshalb besteht die Fuellung aus vielen kleinen Segmenten,
           von denen jedes die Temperaturfarbe seiner eigenen Bogenposition
           traegt. Zusammen ergibt das einen echten Verlauf entlang des Bogens. */
        .ring-seg {
            fill: none;
            stroke-width: var(--ring-stroke);
            stroke-linecap: butt;
        }

        .ring-thumb {
            stroke: var(--symcon-card, #111);
            transition: fill 0.2s ease;
        }

        /* Center-Scheibe.

           Die Zustandsfarbe liegt jetzt hier statt auf dem Ring: der Ring
           zeigt die Temperatur, der Kreis zeigt den Betriebszustand. Beides
           in voller Saettigung waere zu laut, deshalb wird die Farbe nur
           schwach eingemischt. */
        .ring-center {
            position: absolute;
            width: calc(var(--ring-size) * 0.60);
            height: calc(var(--ring-size) * 0.60);
            border-radius: 50%;
            background:
                color-mix(in srgb, var(--state-color) 9%, var(--panel-bg));
            border: 1px solid
                color-mix(in srgb, var(--state-color) 22%, var(--panel-border));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            pointer-events: none;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .room-temp {
            font-size: var(--fs-temp);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Ventilstellung: bewusst mit Abstand unter der Temperatur, damit die
           grosse Zahl allein wirkt und der Prozentwert nicht daran klebt. */
        .center-sub {
            font-size: var(--fs-sub);
            font-weight: 600;
            line-height: 1.2;
            margin-top: var(--sub-gap, 6px);
            color: color-mix(in srgb, var(--state-color) 70%, var(--text-sub));
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        /* Sollwert-Label unter dem Ring, im normalen Fluss */
        .setpoint-pill {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            padding: 2px 9px;
            border-radius: 999px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            font-size: var(--fs-setpoint);
            font-weight: 700;
            line-height: 1.25;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            pointer-events: none;
        }

        .setpoint-pill .lbl {
            font-size: 0.72em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hidden { display: none !important; }

        /* ---------- Konfigurationshinweis ---------- */

        .config-hint {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            flex: 1 1 auto;
            justify-content: center;
        }

        .config-hint.visible { display: flex; }

        .config-hint-title {
            font-size: var(--fs-sub);
            font-weight: 700;
            color: var(--color-overshoot);
        }

        .config-hint-text {
            font-size: var(--fs-sub);
            line-height: 1.45;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="tile" id="tile">
        <div class="symcon-header-spacer" id="symconSpacer"></div>

        <div class="tile-header">
            <div class="tile-title" id="tileTitle">Fussbodenheizung</div>
            <div class="state-pill" id="statePill">
                <span class="state-dot"></span>
                <span id="stateText">Aus</span>
            </div>
        </div>

        <div class="ring-area" id="ringArea">
          <div class="ring-wrap" id="ringWrap">
            <svg class="ring-svg" id="ringSvg" viewBox="0 0 100 100" aria-hidden="true">
                <!-- 270-Grad-Bogen: startet bei 135 Grad, Luecke unten -->
                <circle class="ring-track" id="ringTrack" cx="50" cy="50" r="42"
                        transform="rotate(135 50 50)"
                        stroke-dasharray="197.92 263.89"></circle>
                <!-- Segmente werden per JS erzeugt: je Bogenposition eine
                     Temperaturfarbe, zusammen ein Verlauf entlang des Bogens. -->
                <g id="ringFillGroup"></g>
                <circle class="ring-thumb" id="ringThumb" cx="20.3" cy="79.7" r="5.5"></circle>
            </svg>

            <div class="ring-center">
                <div class="room-temp" id="roomTempText">–</div>
                <div class="center-sub" id="actuatorText">–</div>
            </div>
          </div>

            <div class="setpoint-pill" id="setpointPill">
                <span class="lbl">Soll</span>
                <span id="setpointText">–</span>
            </div>
        </div>

        <div class="config-hint" id="configHint">
            <div class="config-hint-title">Konfiguration unvollstaendig</div>
            <div class="config-hint-text" id="configHintText"></div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            /* Bogenlaenge fuer 270 Grad bei r=42 */
            var ARC = 197.92;
            var START_ANGLE = 135;
            var SWEEP = 270;

            var els = {
                tile:       document.getElementById('tile'),
                title:      document.getElementById('tileTitle'),
                statePill:  document.getElementById('statePill'),
                stateText:  document.getElementById('stateText'),
                roomTemp:   document.getElementById('roomTempText'),
                actuator:   document.getElementById('actuatorText'),
                setpoint:   document.getElementById('setpointText'),
                setpointPill: document.getElementById('setpointPill'),
                ringArea:   document.getElementById('ringArea'),
                ringSvg:    document.getElementById('ringSvg'),
                ringGroup:  document.getElementById('ringFillGroup'),
                ringThumb:  document.getElementById('ringThumb'),
                ringCenter: document.querySelector('.ring-center'),
                header:     document.querySelector('.tile-header'),
                configHint: document.getElementById('configHint'),
                configText: document.getElementById('configHintText')
            };

            var state = {
                lastState: null,
                canControl: false,
                configured: true,
                // setpoint = angezeigter Wert (optimistisch beim Ziehen)
                // confirmed = zuletzt vom Backend gemeldeter Wert
                setpoint: 22,
                confirmed: 22,
                step: 0.5,
                min: 5,
                max: 35,
                dragging: false,
                pendingTimer: null
            };

            /* ----------------------------------------------------------------
             * Skalierung aus der echten Kachelgroesse
             * ---------------------------------------------------------------- */

            function applyScale() {
                var w = els.tile.clientWidth;
                var h = els.tile.clientHeight;
                if (w <= 0 || h <= 0) { return; }

                var root = document.documentElement;

                var compact = h < 130;
                // Sehr flache Kacheln: der Kopf entfaellt, weil IP-Symcon den
                // Instanznamen ohnehin darueber zeichnet. Platz ist dort knapper
                // als Information.
                var noHeader = h < 115;

                els.header.classList.toggle('hidden', noHeader);

                root.style.setProperty('--gap', (compact ? 3 : 6) + 'px');

                // Symcon zeichnet den Instanznamen ueber die Kachel
                var spacer = Math.max(18, Math.min(h * 0.13, 32));
                root.style.setProperty('--spacer-h', spacer.toFixed(0) + 'px');

                els.setpointPill.classList.remove('hidden');
                root.style.setProperty('--fs-title', Math.max(9, Math.min(w * 0.040, 15)).toFixed(1) + 'px');
                root.style.setProperty('--fs-pill', Math.max(8, Math.min(w * 0.032, 12)).toFixed(1) + 'px');

                // Pille bekommt zuerst ihre Schriftgroesse, damit ihre echte
                // Hoehe gemessen werden kann.
                var setpointSize = Math.max(9, Math.min(w * 0.048, 17));
                root.style.setProperty('--fs-setpoint', setpointSize.toFixed(1) + 'px');

                var pillH = els.setpointPill.offsetHeight || setpointSize * 1.9;

                // Verbleibende Flaeche fuer den Ring: die Ringflaeche minus Pille
                // und Zwischenabstand. Pille und Ring stehen im Fluss, deshalb
                // wird hier nichts mehr absolut positioniert.
                var availW = els.ringArea.clientWidth;
                var availH = Math.max(0, els.ringArea.clientHeight - pillH - 2);

                var ring = Math.min(availW, availH);
                ring = Math.max(36, Math.min(ring, 240));

                root.style.setProperty('--ring-size', ring.toFixed(0) + 'px');

                // Strich- und Thumb-Groesse relativ zum Ring
                var stroke = Math.max(4, Math.min(ring * 0.072, 11));
                var thumbR = Math.max(3, Math.min(ring * 0.048, 7.5));
                root.style.setProperty('--ring-stroke', stroke.toFixed(1));
                root.style.setProperty('--thumb-r', thumbR.toFixed(1));

                els.ringThumb.setAttribute('r', (thumbR * (100 / ring)).toFixed(2));
                els.ringThumb.setAttribute('stroke-width', Math.max(0.8, (ring * 0.008)).toFixed(2));

                fitCenterText(ring);
                setRing(state.setpoint, true);
            }

            /* ----------------------------------------------------------------
             * Text in die Mittelscheibe einpassen.
             *
             * Eine rein rechnerische Schriftgroesse ist bei wechselnder
             * Textlaenge ("5,0 °C" vs "-12,5 °C") immer an einer Stelle falsch.
             * Deshalb wird gemessen: setzen, pruefen ob es ueberlaeuft,
             * verkleinern, wiederholen.
             * ---------------------------------------------------------------- */

            function fitCenterText(ring) {
                var root = document.documentElement;
                var centerW = ring * 0.60;          // Durchmesser der Mittelscheibe
                var centerH = centerW;
                // Innenabstand der Scheibe, damit Text nicht am Rand klebt
                var maxW = centerW * 0.90;
                var maxH = centerH * 0.74;

                var startTemp = Math.max(10, Math.min(ring * 0.30, 46));
                var startSub  = Math.max(7,  Math.min(ring * 0.11, 14));

                // Temperatur verkleinern, bis sie in Breite UND Hoehe passt
                var temp = startTemp;
                for (var i = 0; i < 24; i++) {
                    root.style.setProperty('--fs-temp', temp.toFixed(1) + 'px');
                    root.style.setProperty('--fs-sub', startSub.toFixed(1) + 'px');
                    var tw = els.roomTemp.scrollWidth;
                    var th = els.roomTemp.scrollHeight + els.actuator.scrollHeight;
                    if (tw <= maxW && th <= maxH) { break; }
                    temp -= Math.max(0.8, temp * 0.07);
                    if (temp < 6) { temp = 6; break; }
                }

                // Stellgroesse zusaetzlich verkleinern, falls noetig
                var sub = startSub;
                root.style.setProperty('--fs-temp', temp.toFixed(1) + 'px');
                for (var j = 0; j < 16; j++) {
                    root.style.setProperty('--fs-sub', sub.toFixed(1) + 'px');
                    var th2 = els.roomTemp.scrollHeight + els.actuator.scrollHeight;
                    var tw2 = Math.max(els.roomTemp.scrollWidth, els.actuator.scrollWidth);
                    if (th2 <= maxH && tw2 <= maxW) { break; }
                    sub -= Math.max(0.5, sub * 0.08);
                    if (sub < 6) { sub = 6; break; }
                }
            }

            if (window.ResizeObserver) {
                new ResizeObserver(applyScale).observe(els.tile);
            }
            window.addEventListener('resize', applyScale);

            /* ----------------------------------------------------------------
             * Ring-Darstellung
             * ---------------------------------------------------------------- */

            function clamp(v) {
                return Math.max(state.min, Math.min(state.max, v));
            }

            var SVG_NS = 'http://www.w3.org/2000/svg';
            var RING_R = 42;
            var SEG_COUNT = 72;

            function polarPoint(deg, r) {
                var rad = deg * Math.PI / 180;
                return { x: 50 + r * Math.cos(rad), y: 50 + r * Math.sin(rad) };
            }

            /* Bogenpfad von a0 nach a1 (Grad, im Uhrzeigersinn). */
            function arcPath(a0, a1) {
                var p0 = polarPoint(a0, RING_R);
                var p1 = polarPoint(a1, RING_R);
                var large = (a1 - a0) > 180 ? 1 : 0;
                return 'M ' + p0.x.toFixed(3) + ' ' + p0.y.toFixed(3) +
                       ' A ' + RING_R + ' ' + RING_R + ' 0 ' + large + ' 1 ' +
                       p1.x.toFixed(3) + ' ' + p1.y.toFixed(3);
            }

            function hexToRgb(hex) {
                var h = String(hex).trim().replace('#', '');
                if (h.length === 3) {
                    h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
                }
                return [
                    parseInt(h.substring(0, 2), 16),
                    parseInt(h.substring(2, 4), 16),
                    parseInt(h.substring(4, 6), 16)
                ];
            }

            /* Farbe an einer Position der Skala: 0 = kalt, 1 = warm.

               Zwischen den Stuetzpunkten wird linear gemischt. Eine direkte
               Mischung von Blau nach Rot wuerde in der Mitte Violett ergeben,
               deshalb liegen neutrale Zwischenfarben dazwischen. */
            function scaleColor(t) {
                t = Math.max(0, Math.min(1, t));
                var stops = state.stops;
                if (!stops || stops.length < 2) { return 'rgb(148,163,184)'; }

                var pos = t * (stops.length - 1);
                var i = Math.floor(pos);
                if (i >= stops.length - 1) { i = stops.length - 2; pos = stops.length - 1; }
                var f = pos - i;

                var a = stops[i];
                var b = stops[i + 1];
                var r = Math.round(a[0] + (b[0] - a[0]) * f);
                var g = Math.round(a[1] + (b[1] - a[1]) * f);
                var bl = Math.round(a[2] + (b[2] - a[2]) * f);
                return 'rgb(' + r + ',' + g + ',' + bl + ')';
            }

            /* Skalenfarben aus den CSS-Variablen lesen, damit hell und dunkel
               jeweils ihre eigenen, kontraststarken Werte verwenden. */
            function readScaleColors() {
                var cs = window.getComputedStyle(document.documentElement);
                var defaults = ['#3B82F6', '#7DD3FC', '#94A3B8', '#FB923C', '#EF4444'];
                state.stops = [];

                for (var i = 0; i < defaults.length; i++) {
                    var raw = cs.getPropertyValue('--grad-' + i).trim() || defaults[i];
                    state.stops.push(hexToRgb(raw));
                }

                state.restOpacity = parseFloat(cs.getPropertyValue('--grad-rest')) || 0.16;
            }

            /* Segmente einmal aufbauen; setRing aendert danach nur noch
               Deckkraft und Thumb-Farbe. */
            function buildRing() {
                els.ringGroup.innerHTML = '';
                state.segs = [];
                readScaleColors();

                for (var i = 0; i < SEG_COUNT; i++) {
                    var t0 = i / SEG_COUNT;
                    var t1 = (i + 1) / SEG_COUNT;
                    var seg = document.createElementNS(SVG_NS, 'path');
                    seg.setAttribute('d', arcPath(START_ANGLE + t0 * SWEEP, START_ANGLE + t1 * SWEEP));
                    seg.setAttribute('class', 'ring-seg');
                    seg.setAttribute('stroke', scaleColor((t0 + t1) / 2));
                    els.ringGroup.appendChild(seg);
                    state.segs.push(seg);
                }
            }

            function setRing(value, silent) {
                var span = state.max - state.min;
                var t = span > 0 ? (clamp(value) - state.min) / span : 0;
                t = Math.max(0, Math.min(1, t));

                if (!state.segs || state.segs.length === 0) { buildRing(); }

                // Nur der gefuellte Teil wird gezeichnet. Der Rest bleibt der
                // blasse Track-Kreis darunter: halbtransparente Segmente wuerden
                // sich an den Nahtstellen ueberlagern und Streifen bilden.
                var filled = Math.round(t * SEG_COUNT);
                for (var i = 0; i < SEG_COUNT; i++) {
                    state.segs[i].style.display = (i < filled) ? '' : 'none';
                }

                var deg = START_ANGLE + t * SWEEP;
                var rad = deg * Math.PI / 180;
                els.ringThumb.setAttribute('cx', (50 + RING_R * Math.cos(rad)).toFixed(2));
                els.ringThumb.setAttribute('cy', (50 + RING_R * Math.sin(rad)).toFixed(2));
                els.ringThumb.style.fill = scaleColor(t);

                if (!silent) {
                    els.setpoint.textContent = formatTemp(value);
                }
                return t;
            }

            function setState(key) {
                if (key === state.lastState) { return; }
                state.lastState = key;

                var map = {
                    heating:   '--color-heating',
                    holding:   '--color-holding',
                    idle:      '--color-idle',
                    overshoot: '--color-overshoot'
                };
                document.documentElement.style.setProperty(
                    '--state-color', 'var(' + (map[key] || '--color-idle') + ')'
                );

                els.statePill.classList.toggle('is-heating', key === 'heating');
            }

            /* ----------------------------------------------------------------
             * Sollwert-Bedienung am Ring
             * ---------------------------------------------------------------- */

            function formatTemp(v) {
                return (Math.round(v * 10) / 10).toFixed(1).replace('.', ',') + ' °C';
            }

            function snap(v) {
                var step = state.step > 0 ? state.step : 0.5;
                return clamp(Math.round(v / step) * step);
            }

            function angleToValue(clientX, clientY) {
                var rect = els.ringSvg.getBoundingClientRect();
                var cx = rect.left + rect.width / 2;
                var cy = rect.top + rect.height / 2;
                var dx = clientX - cx;
                var dy = clientY - cy;

                var deg = Math.atan2(dy, dx) * 180 / Math.PI;
                if (deg < 0) { deg += 360; }

                // Luecke unten (45..135): dem naechsten Ende zuordnen.
                // 45 Grad liegt am ENDE des Bogens (= Maximum),
                // 135 Grad am ANFANG (= Minimum).
                if (deg > 45 && deg < 135) {
                    deg = (deg < 90) ? START_ANGLE + SWEEP : START_ANGLE;
                } else {
                    if (deg < START_ANGLE) { deg += 360; }
                }

                var t = (deg - START_ANGLE) / SWEEP;
                t = Math.max(0, Math.min(1, t));
                return state.min + t * (state.max - state.min);
            }

            function commit(value) {
                value = snap(value);
                if (!state.canControl) { return; }
                if (value === state.confirmed) {
                    state.setpoint = value;
                    setRing(value);
                    return;
                }

                state.setpoint = value;
                setRing(value);

                if (state.pendingTimer) { clearTimeout(state.pendingTimer); }
                state.pendingTimer = setTimeout(function () {
                    // Kein Push vom Backend -> auf bestaetigten Wert zurueck
                    state.pendingTimer = null;
                    state.setpoint = state.confirmed;
                    setRing(state.confirmed);
                }, 1500);

                if (typeof requestAction === 'function') {
                    requestAction('setSetpoint', value);
                }
            }

            var activePointer = null;

            function onPointerDown(ev) {
                if (!state.canControl || !state.configured) { return; }
                activePointer = ev.pointerId;
                state.dragging = true;
                els.ringSvg.classList.add('is-dragging');
                if (els.ringSvg.setPointerCapture) {
                    try { els.ringSvg.setPointerCapture(ev.pointerId); } catch (e) {}
                }
                var v = angleToValue(ev.clientX, ev.clientY);
                state.setpoint = snap(v);
                setRing(state.setpoint);
                ev.preventDefault();
            }

            function onPointerMove(ev) {
                if (!state.dragging || ev.pointerId !== activePointer) { return; }
                var v = angleToValue(ev.clientX, ev.clientY);
                state.setpoint = snap(v);
                setRing(state.setpoint);
                ev.preventDefault();
            }

            function onPointerUp(ev) {
                if (!state.dragging || ev.pointerId !== activePointer) { return; }
                state.dragging = false;
                activePointer = null;
                els.ringSvg.classList.remove('is-dragging');
                commit(state.setpoint);
                ev.preventDefault();
            }

            els.ringSvg.addEventListener('pointerdown', onPointerDown);
            els.ringSvg.addEventListener('pointermove', onPointerMove);
            els.ringSvg.addEventListener('pointerup', onPointerUp);
            els.ringSvg.addEventListener('pointercancel', onPointerUp);

            // Tastaturbedienung als Ausweichweg
            els.ringSvg.setAttribute('tabindex', '0');
            els.ringSvg.addEventListener('keydown', function (ev) {
                if (!state.canControl) { return; }
                var delta = 0;
                if (ev.key === 'ArrowUp' || ev.key === 'ArrowRight') { delta = state.step; }
                if (ev.key === 'ArrowDown' || ev.key === 'ArrowLeft') { delta = -state.step; }
                if (delta === 0) { return; }
                ev.preventDefault();
                commit(state.setpoint + delta);
            });

            /* ----------------------------------------------------------------
             * Nachrichten vom Backend
             * ---------------------------------------------------------------- */

            function handleMessage(raw) {
                var data;
                try {
                    data = (typeof raw === 'string') ? JSON.parse(raw) : raw;
                } catch (e) {
                    return;
                }
                if (!data) { return; }

                var configured = data.configured !== false;
                state.configured = configured;

                els.configHint.classList.toggle('visible', !configured);
                els.ringArea.classList.toggle('hidden', !configured);

                if (!configured) {
                    els.configText.textContent = 'Bitte im Modul folgende Variablen zuweisen: '
                        + ((data.missing || []).join(', ') || 'Variablen') + '.';
                }

                if (typeof data.title === 'string') { els.title.textContent = data.title; }

                els.roomTemp.textContent = data.roomTempText || '–';
                els.actuator.textContent = data.actuatorText || '–';

                if (configured) {
                    setState(data.state || 'idle');
                    els.stateText.textContent = data.stateText || 'Aus';
                } else {
                    setState('idle');
                    els.stateText.textContent = 'Aus';
                }

                state.canControl = data.canControl === true && configured;
                els.ringSvg.style.cursor = state.canControl ? 'pointer' : 'default';

                if (typeof data.setpointMin === 'number')  { state.min  = data.setpointMin; }
                if (typeof data.setpointMax === 'number')  { state.max  = data.setpointMax; }
                if (typeof data.setpointStep === 'number') { state.step = data.setpointStep; }

                if (typeof data.setpoint === 'number') {
                    // Bestaetigter Wert vom Backend
                    if (state.pendingTimer) { clearTimeout(state.pendingTimer); state.pendingTimer = null; }
                    state.confirmed = data.setpoint;
                    if (!state.dragging) {
                        state.setpoint = data.setpoint;
                        setRing(data.setpoint);
                    }
                } else {
                    // Kein Sollwert bekannt: Ring leer lassen statt einen
                    // Fuellstand vorzutaeuschen.
                    els.setpoint.textContent = '–';
                    if (!state.segs || state.segs.length === 0) { buildRing(); }
                    for (var k = 0; k < SEG_COUNT; k++) {
                        state.segs[k].style.display = 'none';
                    }
                    els.ringThumb.style.fill = scaleColor(0);
                }

                applyScale();
            }

            window.handleMessage = handleMessage;
            applyScale();

            if (window.__INITIAL_DATA__ && !window.__INITIAL_RENDERED__) {
                window.__INITIAL_RENDERED__ = true;
                handleMessage(window.__INITIAL_DATA__);
            }
        })();
    </script>
</body>
</html>
