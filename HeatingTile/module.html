<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Heizung Tile</title>
    <!-- IP-Symcon Theme-Bootstrap: liest die vom Tile-Frame uebergebenen Theme-Farben
         (cardcolor/textcolor/accentcolor) und setzt data-theme="light|dark" VOR dem ersten Paint. -->
    <script>
        (function () {
            'use strict';
            function parseHex(value) {
                if (!value) { return null; }
                var h = String(value).trim();
                if (h.charAt(0) === '#') { h = h.substring(1); }
                if (h.length === 3) {
                    h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
                }
                if (!/^[0-9a-f]{6}$/i.test(h)) { return null; }
                return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
            }
            function luminance(c) {
                function channel(x) { x = x / 255; return (x <= 0.03928) ? (x / 12.92) : Math.pow((x + 0.055) / 1.055, 2.4); }
                return 0.2126 * channel(c.r) + 0.7152 * channel(c.g) + 0.0722 * channel(c.b);
            }
            var params = new URLSearchParams(window.location.search);
            var card = parseHex(params.get('cardcolor'));
            var text = parseHex(params.get('textcolor'));
            var accent = parseHex(params.get('accentcolor'));

            var isLight = null;
            if (card) { isLight = luminance(card) > 0.45; }
            else if (text) { isLight = luminance(text) < 0.45; }
            else if (window.matchMedia) { isLight = window.matchMedia('(prefers-color-scheme: light)').matches; }

            var root = document.documentElement;
            root.setAttribute('data-theme', isLight ? 'light' : 'dark');
            if (card) { root.style.setProperty('--symcon-card', 'rgb(' + card.r + ',' + card.g + ',' + card.b + ')'); }
            if (text) { root.style.setProperty('--symcon-text', 'rgb(' + text.r + ',' + text.g + ',' + text.b + ')'); }
            if (accent) { root.style.setProperty('--symcon-accent', 'rgb(' + accent.r + ',' + accent.g + ',' + accent.b + ')'); }
        })();
    </script>

    <style>
        :root {
            --accent: #38BDF8;

            --panel-bg: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.12);
            --gauge-track: rgba(255, 255, 255, 0.10);
            --slider-track: rgba(255, 255, 255, 0.14);

            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --text-muted: #64748B;

            --color-heating: #EF4444;
            --color-holding: #10B981;
            --color-idle: #64748B;
            --color-overshoot: #F59E0B;

            --state-color: var(--color-idle);

            /* Skalierung: werden per JS aus der echten Kachelgroesse gesetzt */
            --fs-temp: 40px;
            --fs-sub: 12px;
            --fs-title: 13px;
            --fs-pill: 11px;
            --fs-gauge: 18px;
            --gauge-size: 84px;
            --gap: 8px;
        }

        :root[data-theme="light"] {
            --panel-bg: rgba(15, 23, 42, 0.04);
            --panel-border: rgba(15, 23, 42, 0.12);
            --gauge-track: rgba(15, 23, 42, 0.10);
            --slider-track: rgba(15, 23, 42, 0.16);

            --text-main: #0F172A;
            --text-sub: #475569;
            --text-muted: #64748B;

            --color-heating: #B91C1C;
            --color-holding: #047857;
            --color-idle: #475569;
            --color-overshoot: #B45309;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: transparent;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Platzhalter fuer den Titel, den IP-Symcon selbst ueber die Kachel
           zeichnet (Instanzname). Ohne diesen Platz ueberlappt Symcons Titel
           mit dem eigenen Kachelinhalt. */
        .symcon-header-spacer {
            width: 100%;
            flex: 0 0 auto;
            height: var(--spacer-h, 18px);
        }

        .tile {
            width: 100%;
            height: 100%;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            min-height: 0;
            overflow: hidden;
        }

        /* ---------- Kopf ---------- */

        .tile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 0 0 auto;
            min-width: 0;
        }

        .tile-title {
            font-size: var(--fs-title);
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            /* Muss schrumpfen koennen: lange Raumnamen duerfen die
               Zustands-Pille nicht aus dem Rahmen draengen. */
            flex: 1 1 auto;
            min-width: 0;
        }

        .state-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: var(--fs-pill);
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            flex: 0 0 auto;
            color: var(--state-color);
            background: color-mix(in srgb, var(--state-color) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--state-color) 32%, transparent);
            transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .state-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--state-color);
        }

        .state-pill.is-heating .state-dot {
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.3; transform: scale(0.75); }
        }

        /* ---------- Hauptbereich ---------- */

        .main {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 0;
            /* Sicherheitsnetz: lieber beschneiden als ueberlappen */
            overflow: hidden;
        }

        .values {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .room-temp {
            font-size: var(--fs-temp);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .temp-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 3px;
            font-size: var(--fs-sub);
            color: var(--text-sub);
            font-variant-numeric: tabular-nums;
        }

        .temp-item {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            white-space: nowrap;
        }

        .temp-item .lbl { color: var(--text-muted); font-weight: 500; }
        .temp-item .val { font-weight: 600; color: var(--text-main); }

        .hidden { display: none !important; }

        /* ---------- Gauge ---------- */

        .gauge {
            flex: 0 0 auto;
            width: var(--gauge-size);
            height: var(--gauge-size);
            position: relative;
        }

        .gauge svg {
            width: 100%;
            height: 100%;
            display: block;
            transform: rotate(135deg);
        }

        .gauge-track {
            fill: none;
            stroke: var(--gauge-track);
            stroke-width: 9;
            stroke-linecap: round;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 9;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.45s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.25s ease;
        }

        .gauge.is-heating   .gauge-fill { stroke: var(--color-heating); }
        .gauge.is-holding   .gauge-fill { stroke: var(--color-holding); }
        .gauge.is-idle      .gauge-fill { stroke: var(--text-muted); }
        .gauge.is-overshoot .gauge-fill { stroke: var(--color-overshoot); }

        .gauge-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .gauge-value {
            font-size: var(--fs-gauge);
            font-weight: 700;
            line-height: 1;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .gauge-label {
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ---------- Sollwert-Bedienung ---------- */

        .control {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
        }

        .step-btn {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            border-radius: 7px;
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .step-btn:hover  { background: var(--panel-border); }
        .step-btn:active { transform: scale(0.92); }

        /* Kompaktmodus fuer flache Kacheln */
        .control.compact {
            padding: 3px 5px;
            gap: 5px;
        }

        .control.compact .step-btn {
            width: 21px;
            height: 21px;
            font-size: 12px;
            border-radius: 6px;
        }

        .control.compact .slider-value {
            min-width: 40px;
        }

        .slider-wrap {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .slider {
            flex: 1 1 auto;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--slider-track);
            outline: none;
            min-width: 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--state-color);
            border: 2px solid var(--symcon-card, #111);
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .slider::-webkit-slider-thumb:active { transform: scale(1.2); }

        .slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--state-color);
            border: 2px solid var(--symcon-card, #111);
            cursor: pointer;
        }

        .slider-value {
            flex: 0 0 auto;
            font-size: var(--fs-sub);
            font-weight: 700;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            min-width: 46px;
            text-align: right;
        }

        /* ---------- Konfigurationshinweis ---------- */

        .config-hint {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
        }

        .config-hint.visible { display: flex; }

        .config-hint-title {
            font-size: var(--fs-sub);
            font-weight: 700;
            color: var(--color-overshoot);
        }

        .config-hint-text {
            font-size: var(--fs-sub);
            line-height: 1.45;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="tile" id="tile">
        <div class="symcon-header-spacer" id="symconSpacer"></div>

        <div class="tile-header">
            <div class="tile-title" id="tileTitle">Fussbodenheizung</div>
            <div class="state-pill" id="statePill">
                <span class="state-dot"></span>
                <span id="stateText">Aus</span>
            </div>
        </div>

        <div class="main" id="mainArea">
            <div class="values">
                <div class="room-temp" id="roomTempText">–</div>
                <div class="temp-labels">
                    <span class="temp-item">
                        <span class="lbl">Soll</span>
                        <span class="val" id="setpointText">–</span>
                    </span>
                    <span class="temp-item" id="baseWrap">
                        <span class="lbl">Basis</span>
                        <span class="val" id="baseText">–</span>
                    </span>
                </div>
            </div>

            <div class="gauge is-idle" id="gauge">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                    <circle class="gauge-track" cx="50" cy="50" r="42"
                            stroke-dasharray="197.9 263.9"></circle>
                    <circle class="gauge-fill" id="gaugeFill" cx="50" cy="50" r="42"
                            stroke-dasharray="197.9 263.9" stroke-dashoffset="197.9"></circle>
                </svg>
                <div class="gauge-center">
                    <div class="gauge-value" id="actuatorText">–</div>
                    <div class="gauge-label" id="gaugeLabel">Stellgr.</div>
                </div>
            </div>
        </div>

        <div class="control" id="controlBar">
            <button class="step-btn" id="btnMinus" type="button" aria-label="Sollwert senken">−</button>
            <div class="slider-wrap">
                <input class="slider" id="setpointSlider" type="range" min="5" max="35" step="0.5" value="22">
                <span class="slider-value" id="sliderValue">–</span>
            </div>
            <button class="step-btn" id="btnPlus" type="button" aria-label="Sollwert erhoehen">+</button>
        </div>

        <div class="config-hint" id="configHint">
            <div class="config-hint-title">Konfiguration unvollstaendig</div>
            <div class="config-hint-text" id="configHintText"></div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var ARC_LENGTH = 197.9;

            var els = {
                tile:       document.getElementById('tile'),
                title:      document.getElementById('tileTitle'),
                statePill:  document.getElementById('statePill'),
                stateText:  document.getElementById('stateText'),
                roomTemp:   document.getElementById('roomTempText'),
                setpoint:   document.getElementById('setpointText'),
                baseText:   document.getElementById('baseText'),
                baseWrap:   document.getElementById('baseWrap'),
                gauge:      document.getElementById('gauge'),
                gaugeFill:  document.getElementById('gaugeFill'),
                gaugeLabel: document.getElementById('gaugeLabel'),
                actuator:   document.getElementById('actuatorText'),
                controlBar: document.getElementById('controlBar'),
                slider:     document.getElementById('setpointSlider'),
                sliderVal:  document.getElementById('sliderValue'),
                btnMinus:   document.getElementById('btnMinus'),
                btnPlus:    document.getElementById('btnPlus'),
                configHint: document.getElementById('configHint'),
                configText: document.getElementById('configHintText'),
                mainArea:   document.getElementById('mainArea')
            };

            var state = {
                lastState: null,
                canControl: false,
                // setpoint = was der Nutzer gerade sieht (optimistisch)
                // confirmed = was das Backend zuletzt gemeldet hat
                setpoint: 22,
                confirmed: 22,
                step: 0.5,
                min: 5,
                max: 35,
                pendingValue: null,
                pendingTimer: null
            };

            /* ----------------------------------------------------------------
             * Skalierung: alle Schriftgroessen aus der echten Kachelgroesse.
             * Die Kachel wird im WebFront frei skaliert, deshalb ist eine
             * feste Pixelgroesse immer an mindestens einer Stelle falsch.
             * ---------------------------------------------------------------- */

            var ui = {
                tempLabels: document.querySelector('.temp-labels')
            };

            /* Schriftgroessen fuer einen gegebenen Schrumpffaktor setzen. */
            function applySizes(w, h, scale, opts) {
                var root = document.documentElement;
                var base = Math.min(w, h * 1.45) * scale;

                var tempSize  = Math.max(13, Math.min(base * 0.21, 62));
                var subSize   = Math.max(8,  Math.min(base * 0.037, 14));
                var titleSize = Math.max(9,  Math.min(base * 0.040, 15));

                // Gauge zusaetzlich durch die verfuegbare Hoehe des Hauptbereichs begrenzen
                var availMain = els.mainArea.clientHeight;
                var gaugeByBox = Math.min(w, h) * 0.42 * scale;
                var gaugeSize = Math.min(gaugeByBox, availMain > 0 ? availMain * 0.98 : gaugeByBox, 116);
                gaugeSize = Math.max(0, gaugeSize);

                root.style.setProperty('--fs-temp', tempSize.toFixed(1) + 'px');
                root.style.setProperty('--fs-sub', subSize.toFixed(1) + 'px');
                root.style.setProperty('--fs-title', titleSize.toFixed(1) + 'px');
                root.style.setProperty('--fs-pill', Math.max(8, subSize * 0.92).toFixed(1) + 'px');
                root.style.setProperty('--fs-gauge', Math.max(9, gaugeSize * 0.20).toFixed(1) + 'px');
                root.style.setProperty('--gauge-size', gaugeSize.toFixed(0) + 'px');
                root.style.setProperty('--gap', (opts.compact ? 5 : 8) + 'px');

                // IP-Symcon zeichnet den Instanznamen ueber die Kachel. Der Platzhalter
                // muss diesen Titel abdecken: nie kleiner als 18px (echte Titelhoehe),
                // bei grossen Kacheln mitwachsend.
                var spacer = Math.max(18, Math.min(h * 0.13, 32));
                root.style.setProperty('--spacer-h', spacer.toFixed(0) + 'px');
            }

            /* Prueft, ob nach dem Setzen der Groessen noch etwas ueberlaeuft. */
            function hasOverflow(w, h) {
                if (els.tile.scrollHeight > h + 1 || els.tile.scrollWidth > w + 1) {
                    return true;
                }
                // Hauptbereich: Inhalt darf nicht groesser sein als der Bereich
                if (els.mainArea.scrollHeight > els.mainArea.clientHeight + 1) {
                    return true;
                }
                // Grosse Temperaturanzeige darf nicht horizontal aus dem Block laufen
                var block = els.roomTemp.parentElement;
                if (block && els.roomTemp.scrollWidth > block.clientWidth + 1) {
                    return true;
                }
                return false;
            }

            function applyScale() {
                var w = els.tile.clientWidth;
                var h = els.tile.clientHeight;
                if (w <= 0 || h <= 0) { return; }

                // Stufenweise Ausduennung: erst Beschriftungen, dann das Gauge.
                var compact = h < 130;
                var hideLabels = h < 125;
                var hideGauge = !compact && false;
                hideGauge = h < 118;

                ui.tempLabels.classList.toggle('hidden', hideLabels);
                els.gaugeLabel.classList.toggle('hidden', hideLabels || h < 145);
                els.gauge.classList.toggle('hidden', hideGauge);
                els.controlBar.classList.toggle('compact', compact);

                // Messschleife: so lange verkleinern, bis nichts mehr ueberlaeuft.
                var scale = 1;
                var opts = { compact: compact };
                for (var i = 0; i < 18; i++) {
                    applySizes(w, h, scale, opts);
                    if (!hasOverflow(w, h)) { break; }
                    scale -= 0.055;
                    if (scale < 0.42) { scale = 0.42; break; }
                }
            }

            if (window.ResizeObserver) {
                new ResizeObserver(applyScale).observe(els.tile);
            }
            window.addEventListener('resize', applyScale);
            applyScale();

            /* ----------------------------------------------------------------
             * Darstellung
             * ---------------------------------------------------------------- */

            function setGauge(percent) {
                var p = Math.max(0, Math.min(100, Number(percent) || 0));
                els.gaugeFill.style.strokeDashoffset = (ARC_LENGTH - (ARC_LENGTH * p / 100)).toFixed(2);
            }

            function setState(key) {
                if (key === state.lastState) { return; }
                state.lastState = key;

                els.gauge.classList.remove('is-heating', 'is-holding', 'is-idle', 'is-overshoot');
                els.gauge.classList.add('is-' + key);

                els.statePill.classList.toggle('is-heating', key === 'heating');

                var map = {
                    heating:   '--color-heating',
                    holding:   '--color-holding',
                    idle:      '--color-idle',
                    overshoot: '--color-overshoot'
                };
                document.documentElement.style.setProperty(
                    '--state-color', 'var(' + (map[key] || '--color-idle') + ')'
                );
            }

            /* ----------------------------------------------------------------
             * Sollwert-Bedienung
             * ---------------------------------------------------------------- */

            function formatTemp(v) {
                return (Math.round(v * 10) / 10).toFixed(1).replace('.', ',') + ' °C';
            }

            function snap(v) {
                var step = state.step > 0 ? state.step : 0.5;
                v = Math.round(v / step) * step;
                return Math.max(state.min, Math.min(state.max, Math.round(v * 10) / 10));
            }

            function pushSetpoint(value) {
                value = snap(value);
                if (value === state.setpoint) { return; }

                state.setpoint = value;
                els.slider.value = String(value);
                els.sliderVal.textContent = formatTemp(value);

                // Optimistisch: Anzeige sofort nachziehen, dann bestaetigen lassen
                state.pendingValue = value;
                if (state.pendingTimer) { clearTimeout(state.pendingTimer); }
                state.pendingTimer = setTimeout(function () {
                    // Kein Push vom Backend innerhalb von 1,5 s -> der Schreibvorgang
                    // hat nicht gegriffen. Anzeige auf den zuletzt bestaetigten
                    // Wert zurueckziehen, statt eine Luege stehen zu lassen.
                    state.pendingTimer = null;
                    state.pendingValue = null;
                    state.setpoint = state.confirmed;
                    els.slider.value = String(state.confirmed);
                    els.sliderVal.textContent = formatTemp(state.confirmed);
                }, 1500);

                if (typeof requestAction === 'function') {
                    requestAction('setSetpoint', value);
                }
            }

            els.slider.addEventListener('input', function () {
                els.sliderVal.textContent = formatTemp(parseFloat(els.slider.value));
            });

            els.slider.addEventListener('change', function () {
                pushSetpoint(parseFloat(els.slider.value));
            });

            els.btnMinus.addEventListener('click', function () {
                pushSetpoint(parseFloat(els.slider.value) - state.step);
            });

            els.btnPlus.addEventListener('click', function () {
                pushSetpoint(parseFloat(els.slider.value) + state.step);
            });

            /* ----------------------------------------------------------------
             * Nachrichten vom Backend
             * ---------------------------------------------------------------- */

            function handleMessage(raw) {
                var data;
                try {
                    data = (typeof raw === 'string') ? JSON.parse(raw) : raw;
                } catch (e) {
                    return;
                }
                if (!data) { return; }

                var configured = data.configured !== false;
                els.configHint.classList.toggle('visible', !configured);
                els.mainArea.classList.toggle('hidden', !configured);

                if (!configured) {
                    els.configText.textContent = 'Bitte im Modul folgende Variablen zuweisen: '
                        + ((data.missing || []).join(', ') || 'Variablen') + '.';
                }

                if (typeof data.title === 'string') { els.title.textContent = data.title; }

                els.roomTemp.textContent = data.roomTempText || '–';
                els.setpoint.textContent = data.setpointText || '–';
                els.baseText.textContent = data.baseSetpointText || '–';
                els.baseWrap.classList.toggle('hidden', data.showBase === false);

                els.actuator.textContent = data.actuatorText || '–';
                setGauge(configured ? (data.actuator || 0) : 0);

                if (configured) {
                    setState(data.state || 'idle');
                    els.stateText.textContent = data.stateText || 'Aus';
                } else {
                    setState('idle');
                    els.stateText.textContent = 'Aus';
                }

                // Sollwert-Bedienung
                state.canControl = data.canControl === true && configured;
                els.controlBar.classList.toggle('hidden', !state.canControl);

                if (typeof data.setpointMin === 'number')  { state.min  = data.setpointMin; }
                if (typeof data.setpointMax === 'number')  { state.max  = data.setpointMax; }
                if (typeof data.setpointStep === 'number') { state.step = data.setpointStep; }

                els.slider.min = String(state.min);
                els.slider.max = String(state.max);
                els.slider.step = String(state.step);

                if (typeof data.setpoint === 'number') {
                    // Kommt ein Push, ist der Wert bestaetigt
                    if (state.pendingTimer) { clearTimeout(state.pendingTimer); state.pendingTimer = null; }
                    state.pendingValue = null;
                    state.confirmed = data.setpoint;
                    state.setpoint = data.setpoint;
                    els.slider.value = String(data.setpoint);
                    els.sliderVal.textContent = formatTemp(data.setpoint);
                } else {
                    els.sliderVal.textContent = '–';
                }
            }

            window.handleMessage = handleMessage;
            applyScale();

            if (window.__INITIAL_DATA__ && !window.__INITIAL_RENDERED__) {
                window.__INITIAL_RENDERED__ = true;
                handleMessage(window.__INITIAL_DATA__);
            }
        })();
    </script>
</body>
</html>
